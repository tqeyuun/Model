<title>시장 날씨판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위에 종합 국면과 '할 일', 아래에 지표 카드 격자 (요약 → 세부) */
:root {
  --bg: #f6f7f5; --surface: #fcfcfb; --fg: #16181a; --muted: #5a5f5c; --line: #dfe2de; --grid: #eceeeb;
  --accent: #2a78d6; --accent-soft: rgba(42,120,214,.12);
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --good-ink: #0a6f0a; --warning-ink: #8a5a00; --critical-ink: #a32424;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121312; --surface: #1a1a19; --fg: #f2f2ef; --muted: #a9aba4; --line: #2e302d; --grid: #262825;
  --accent: #3987e5; --accent-soft: rgba(57,135,229,.18);
  --good-ink: #4cc94c; --warning-ink: #fab219; --critical-ink: #f07a7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121312; --surface: #1a1a19; --fg: #f2f2ef; --muted: #a9aba4; --line: #2e302d; --grid: #262825;
  --accent: #3987e5; --accent-soft: rgba(57,135,229,.18);
  --good-ink: #4cc94c; --warning-ink: #fab219; --critical-ink: #f07a7a; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 24px; }
h1 { font-size: 1.5rem; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: .85rem; margin: 2px 0 0; }
.top { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
@media (max-width: 720px) { .top { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
.regime { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.regime strong { font-size: 1.9rem; letter-spacing: -.02em; }
.counts { color: var(--muted); font-size: .9rem; margin-top: 6px; }
.todo p { margin: 0; }
.todo .do { font-size: 1.15rem; font-weight: 700; }
.todo ul { margin: 8px 0 0; padding-left: 1.1em; color: var(--muted); font-size: .9rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 500; padding: 3px 10px 3px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.good { color: var(--good-ink); --dot: var(--good); }
.pill.warning { color: var(--warning-ink); --dot: var(--warning); }
.pill.critical { color: var(--critical-ink); --dot: var(--critical); }
.pill .ic { font-size: .7rem; color: var(--dot); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
@media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
.card { display: grid; gap: 8px; border-left: 3px solid var(--stripe); }
.card.good { --stripe: var(--good); } .card.warning { --stripe: var(--warning); } .card.critical { --stripe: var(--critical); }
.card-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.card h2 { font-size: .95rem; margin: 0; font-weight: 500; }
.val { font-size: 1.7rem; font-weight: 700; letter-spacing: -.02em; }
.val small { font-size: .9rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 96px; overflow: visible; touch-action: none; }
.axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.readout { font-family: var(--mono); font-size: .75rem; color: var(--muted); min-height: 1.2em; font-variant-numeric: tabular-nums; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
.note a { color: var(--accent); }
footer { color: var(--muted); font-size: .8rem; display: grid; gap: 4px; }
footer p { margin: 0; max-width: 72ch; }
</style>

<div class="wrap">
  <header>
    <h1>시장 날씨판</h1>
    <p class="sub" id="updated"></p>
  </header>

  <section class="top">
    <div class="panel">
      <p class="eyebrow">종합 국면</p>
      <div class="regime"><strong id="regime-text"></strong><span id="regime-pill"></span></div>
      <p class="counts" id="counts"></p>
    </div>
    <div class="panel todo">
      <p class="eyebrow">이번 달 할 일</p>
      <p class="do">자동매수 그대로 유지</p>
      <ul>
        <li>주식 70 : 채권 30 비중은 1년에 한 번만 점검</li>
        <li>지표가 빨간색이어도 팔지 않습니다. 이 판은 상황을 아는 용도입니다</li>
      </ul>
    </div>
  </section>

  <section class="grid" id="cards" aria-label="지표"></section>

  <footer>
    <p>매매 신호가 아닙니다. 이 프로젝트의 백테스트에서 추세·변동성 신호로 비중을 바꾸는 방식은 고정 비중을 이기지 못했습니다.</p>
    <p>자료: FRED (미국 세인트루이스 연준) — S&amp;P500, 금리차, 샴 룰, 신용 스프레드, VIX. 페이지를 열 때 자동 갱신 (최대 6시간 캐시). 최근 3년 표시.</p>
  </footer>
</div>

<script>
const DATA = <?!= data ?>;
const ICON = { good: "●", warning: "▲", critical: "■" };
const fmt = (v, u) => (u === "%" || u === "%p" ? (v > 0 ? "+" : "") : "") + v.toFixed(u === "" ? 1 : 2);
const pill = (lvl, lab) => `<span class="pill ${lvl}"><span class="ic" aria-hidden="true">${ICON[lvl]}</span>${lab}</span>`;

document.getElementById("updated").textContent = `갱신 ${DATA.updated} · S&P500 ${DATA.spx.level.toLocaleString()} (${DATA.spx.date} 종가)`;
document.getElementById("regime-text").textContent = DATA.regime[1];
document.getElementById("regime-pill").innerHTML = pill(DATA.regime[0], DATA.regime[0] === "good" ? "정상" : DATA.regime[0] === "warning" ? "주의" : "위험");
document.getElementById("counts").textContent = `지표 ${DATA.indicators.length}개 중 주의 ${DATA.n_warn}개 · 위험 ${DATA.n_crit}개`;

const W = 300, H = 96, PAD = 4;
function chart(ind) {
  const s = ind.series, vals = s.map(p => p[1]).concat(ind.ref);
  let lo = Math.min(...vals), hi = Math.max(...vals); const m = (hi - lo) * .08 || 1; lo -= m; hi += m;
  const x = i => (i / (s.length - 1)) * W, y = v => PAD + (1 - (v - lo) / (hi - lo)) * (H - 2 * PAD);
  const d = s.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area = `${d}L${W},${H}L0,${H}Z`;
  const refs = ind.ref.map(r => `<line x1="0" x2="${W}" y1="${y(r)}" y2="${y(r)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity=".7"/>`).join("");
  const last = s[s.length - 1];
  return { lo, hi, svg: `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${ind.name} 최근 3년 추이">
      <line x1="0" x2="${W}" y1="${y(hi - m)}" y2="${y(hi - m)}" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      ${refs}
      <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <circle class="end" cx="${x(s.length - 1)}" cy="${y(last[1])}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <line class="cross" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
      <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
    </svg>`, x, y };
}

const cards = document.getElementById("cards");
for (const ind of DATA.indicators) {
  const c = chart(ind), el = document.createElement("article");
  el.className = `panel card ${ind.level}`;
  const refTxt = ind.ref.map(r => fmt(r, ind.unit) + ind.unit).join(", ");
  el.innerHTML = `
    <div class="card-head"><h2>${ind.name}</h2>${pill(ind.level, ind.label)}</div>
    <div class="val">${fmt(ind.value, ind.unit)}<small>${ind.unit}</small></div>
    <div class="chart">${c.svg}</div>
    <div class="axis"><span>${ind.series[0][0].slice(0, 7)}</span><span>점선: ${refTxt}</span><span>${ind.date}</span></div>
    <div class="readout" aria-live="polite">그래프를 가리키면 날짜별 값이 보입니다</div>
    <p class="note">${ind.note}${ind.src ? ` <a href="${ind.src}" target="_blank" rel="noopener">원자료</a>` : ""}</p>`;
  cards.appendChild(el);
  const svg = el.querySelector("svg"), cross = svg.querySelector(".cross"), dot = svg.querySelector(".end"), out = el.querySelector(".readout");
  const lastI = ind.series.length - 1;
  const show = i => {
    const p = ind.series[i]; cross.setAttribute("x1", c.x(i)); cross.setAttribute("x2", c.x(i)); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", c.x(i)); dot.setAttribute("cy", c.y(p[1])); out.textContent = `${p[0]}  ${fmt(p[1], ind.unit)}${ind.unit}`;
  };
  svg.addEventListener("pointermove", e => { const r = svg.getBoundingClientRect(); show(Math.max(0, Math.min(lastI, Math.round((e.clientX - r.left) / r.width * lastI)))); });
  svg.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); dot.setAttribute("cx", c.x(lastI)); dot.setAttribute("cy", c.y(ind.series[lastI][1])); out.textContent = "그래프를 가리키면 날짜별 값이 보입니다"; });
}
</script>
