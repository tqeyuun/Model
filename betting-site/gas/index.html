<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도박장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 도박장 화면: 어두운 남색 바탕 + 금색 강조의 카지노·배팅 사이트풍. 번쩍임 없이 글자와 숫자가 먼저 보이게 */
:root{--bg:#0b0e14;--panel:#0f141d;--card:#151b27;--card2:#1c2433;--ink:#f1f3f8;--mute:#9aa4b5;--line:#2a3447;
 --gold:#f5b82e;--gold2:#b8860b;--red:#e5484d;--blue:#4f9dff;--win:#34d27b;--lose:#ff6369;
 --c0:#4f9dff;--c1:#e5484d;--c2:#34d27b;--c3:#f5b82e;--c4:#a78bfa;--c5:#fb923c;
 --pri:#f5b82e;--pink:#e5484d;--cyan:#4f9dff;--dog:#f5b82e;--display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;min-height:100vh;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--gold2);position:sticky;top:0;z-index:5}
header b{font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:.5px;color:var(--gold)}
.lg{display:flex;align-items:center;gap:8px}.dice{font-size:24px;line-height:1}
header #who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:14px;font-weight:700}
header #who .pts{background:#080b11;border:1px solid var(--gold2);padding:3px 10px;border-radius:99px}
.pts{font-weight:800;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
h2{font-size:17px;font-weight:800;margin:0 0 6px;color:var(--ink)}.card h2 .mute{font-weight:400}
.mute{color:var(--mute);font-size:13px}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:10px 12px;background:#0a0e15;color:var(--ink);outline:none}
input{width:100%;margin:4px 0}input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,184,46,.25)}
input::placeholder{color:#6f7a8d}
button{cursor:pointer;white-space:nowrap;background:var(--card2);font-weight:600}button:hover:not(:disabled){background:#243049}button:active:not(:disabled){transform:scale(.98)}
button.pri{background:var(--gold);border-color:var(--gold);color:#1a1300;font-weight:800}button.pri:hover:not(:disabled){background:#ffc94a}
button.danger{background:#3a1519;border-color:#7a2a30;color:#ff9a9e}
button:disabled{opacity:.4;cursor:default}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.tabs button{border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:800;font-size:15px;padding:12px 4px;color:var(--ink)}
.tabs button.on{background:var(--gold);color:#1a1300}
.tabs.mode{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs.mode button{flex:1 1 calc(50% - 6px);border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px;padding:10px 6px}
.tabs.mode button.on{background:#2a2108;border-color:var(--gold);color:var(--gold)}
.tabs.mode button.wide{flex:1 1 100%}
.opt{--c:var(--c0);margin:10px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--panel)}
.opt .lbl{font-weight:800;font-size:16px;color:var(--ink)}
.bar{height:6px;background:#0a0e15;border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--c,var(--blue));transition:width .5s}
.opt.dog{border-color:#8a5a00;border-left-color:var(--gold);background:#1d1706}.opt.dog .bar i{background:var(--gold)}
.opt.won{border-color:var(--win);border-left-color:var(--win);background:#0f2218}.opt.won .bar i{background:var(--win)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;background:var(--gold);color:#1a1300;margin-left:6px;vertical-align:middle}
.tag.s{background:#16233a;color:var(--blue);border:1px solid #28406a}
.win{color:var(--win);font-weight:800}.lose{color:var(--lose);font-weight:800}
.lucky{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:4px;font-weight:800;color:#1a1300;background:var(--gold)}
.betrow{display:flex;gap:6px;margin-top:6px}.betrow input{margin:0}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1c2433;border:1px solid var(--gold);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:10px;z-index:9;max-width:90%}
table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mute);font-weight:700}
td:nth-child(n+3),th:nth-child(n+3){text-align:right}
tr:nth-child(2) td:first-child{color:#ffd24d;font-weight:800}tr:nth-child(3) td:first-child{color:#c9ced8;font-weight:800}tr:nth-child(4) td:first-child{color:#d68a4a;font-weight:800}
tr:nth-child(2){background:rgba(245,184,46,.07)}
#chatbox{height:50vh;overflow-y:auto;padding:8px;margin:8px 0;background:#0a0e15;border:1px solid var(--line);border-radius:10px}
.cm{margin:8px 0;max-width:85%}.cm.me{margin-left:auto;text-align:right}
.cn{font-size:12px;font-weight:700}.cn span{color:var(--mute);font-weight:400;margin-left:4px}
.cb{display:inline-block;padding:6px 12px;border-radius:10px;background:var(--card2);word-break:break-word;text-align:left}
.cm.me .cb{background:var(--gold);color:#1a1300;font-weight:600}
.ttl{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;margin-right:5px;border-radius:4px;color:#1a1300;background:var(--gold);vertical-align:middle}
.nm{font-weight:700}
.nm.fx-glow{color:#fff;text-shadow:0 0 6px #4f9dff,0 0 14px #a855f7}
.nm.fx-fire{background:linear-gradient(0deg,#ff2d00,#ffb800,#fff176);-webkit-background-clip:text;background-clip:text;color:transparent}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item.eq{border-color:var(--win)}.item .pv{min-height:26px}.item button{width:100%}
.room{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.room.mine{border-color:var(--gold2);background:#17130a}
.hands{display:flex;gap:8px;margin-top:8px}
.hand{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;padding:10px 4px}
.hand span{font-size:30px;line-height:1.1}
.hands.pick{margin:12px 0}.hand.sel{border-color:var(--gold);background:#2a2108}
.rec{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.rec.me{background:rgba(245,184,46,.07)}
.card.done{opacity:.5}.card.done:hover{opacity:.9}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.nums.n4{grid-template-columns:repeat(4,1fr)}.nums.n5{grid-template-columns:repeat(5,1fr)}.nums.n6{grid-template-columns:repeat(3,1fr)}
.num{padding:10px 0;font-weight:800;font-size:16px}.num.sel{border-color:var(--gold);background:#2a2108;color:var(--gold)}
.seats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seat{padding:6px 12px;border-radius:6px;border:1px dashed var(--line);font-size:13px;color:var(--mute)}.seat.on{border-style:solid;color:var(--ink);background:var(--card2)}.seat.mine{border-color:var(--gold)}
button.seat.free{border-style:solid;border-color:var(--blue);color:var(--blue);cursor:pointer;background:transparent}
.pn{display:inline-block;padding:1px 9px;border-radius:4px;background:var(--card2);margin:2px;font-size:13px;border:1px solid transparent}.pn.uq{border-color:var(--blue)}.pn.win{background:#10281b;border-color:var(--win)}
.card.sub{padding:10px}.card.sub.me{border-color:var(--gold2)}
.lv,.lr{stroke:#4a566e;stroke-width:3;stroke-linecap:round}
.rules p,.rules ul,.rules ol{margin:6px 0}.rules li{margin:4px 0}.rules summary{cursor:pointer;font-size:16px;font-weight:700}.rules b{color:var(--gold)}.rules ul,.rules ol{padding-left:20px}
.hand-row{display:flex;flex-wrap:wrap;margin:4px 0}
.pc{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:60px;margin:3px;border-radius:6px;background:#f5f5fa;color:#111;font-weight:800;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.pc.red{color:#d92d3a}.pc.back{background:repeating-linear-gradient(45deg,#1d4ed8,#1d4ed8 6px,#1e3a8a 6px,#1e3a8a 12px);color:#fff}
.reels{display:flex;gap:8px;justify-content:center;margin:14px 0}.reel{width:78px;height:78px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#0a0e15;border:2px solid var(--gold2);border-radius:10px}
.limit{background:#0a0e15;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
.member .kick{padding:0 6px;margin-left:4px;font-size:12px;line-height:18px;border-radius:9px;color:#ff8a8f;border-color:#7a2a30}
.sec{margin:20px 2px 8px;font-size:15px;font-weight:800;border-left:4px solid var(--gold);padding-left:8px}.sec .mute{font-weight:400}
.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.member{padding:4px 10px;border-radius:6px;background:var(--card2);border:1px solid var(--line);font-size:14px}.member.me{border-color:var(--gold)}
/* ---- 🧱 블록 블라스트 ---- */
:root{--b0:#ff5d6c;--b1:#ff9f43;--b2:#ffd43b;--b3:#38d9a9;--b4:#4dabf7;--b5:#9775fa;--b6:#f783ac}
.bbx{--cs:min(calc((100vw - 28px - 28px - 39px) / 8),44px);user-select:none;-webkit-user-select:none}
.bbtop{display:flex;gap:8px;margin-bottom:10px}.bbbox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;text-align:right}
.bbbox small{display:block;color:var(--mute);font-size:11px;font-weight:700}.bbbox b{font-size:20px;font-weight:900}.bbbox.gold b{color:var(--gold)}
.bbwrap{position:relative;width:calc(var(--cs)*8 + 21px + 18px);margin:0 auto}
.bbboard{display:grid;grid-template-columns:repeat(8,var(--cs));grid-template-rows:repeat(8,var(--cs));gap:3px;padding:8px;background:#0a0e15;border:1px solid var(--line);border-radius:12px;touch-action:none}
.bbc{border-radius:6px;background:#161d2c}.bbc:nth-child(odd){background:#131a28}
.bbc.f{background:var(--k);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.28)}
.bbc.pop{animation:bbpop .18s ease-out}.bbc.ok{background:color-mix(in srgb,var(--k) 55%,#161d2c)}.bbc.bad{background:rgba(255,93,108,.35)}.bbc.line{outline:2px solid rgba(245,184,46,.95);outline-offset:-2px}
.bbc.clr{animation:bbclr .32s ease-in forwards}
@keyframes bbpop{0%{transform:scale(.7)}100%{transform:scale(1)}}@keyframes bbclr{0%{filter:brightness(1)}40%{transform:scale(1.12);filter:brightness(1.8)}100%{transform:scale(0);opacity:0}}
.bbtray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bbslot{height:calc(var(--cs)*2.5);display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;touch-action:none}.bbslot.empty{opacity:.35}
.bbpc{display:grid;cursor:grab;touch-action:none}.bbpc.dim{opacity:.35}.bbpc i{display:block;border-radius:5px;background:transparent}
.bbpc i.f{background:var(--k);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.28)}
.bbghost{position:fixed;left:0;top:0;pointer-events:none;z-index:20;display:none;opacity:.95;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.bbfloat{position:absolute;left:50%;top:40%;font-weight:900;font-size:28px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.6);pointer-events:none;animation:bbup .9s ease-out forwards;white-space:nowrap;z-index:6}.bbfloat.big{font-size:36px;color:#fff}
@keyframes bbup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px)}}
.bbover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,11,20,.85);border-radius:12px;z-index:8}.bbover.on{display:flex}
.bbcard{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:18px 20px;text-align:center;max-width:90%}.bbbig{font-size:38px;font-weight:900;line-height:1.1}
/* 🪙 → 게임칩: 글자 🪙 가 화면에 들어오면 아래 스크립트가 이 칩 모양으로 바꿔 끼움 */
.chip{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;vertical-align:-.2em;margin:0 .1em;box-sizing:border-box;
  background:radial-gradient(circle,#d62839 0 30%,#fff 31% 38%,#d62839 39% 47%,transparent 48%),repeating-conic-gradient(#fff 0 16deg,#a31621 16deg 45deg);
  border:.07em solid #fff}
</style>
</head>
<body>
<header><span class="lg"><span class="dice">🎲</span><b>도박장</b></span><span id="who"></span></header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { // 앱스 스크립트 화면에서는 저장소가 막힐 수 있어 안전하게 감쌈
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* 무시 */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* 무시 */ } },
};
let token = LS.get('token'), user = null, tab = 'bets', bets = [], ranking = [], busy = false;

function api(method, url, body) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler((s) => {
        const j = JSON.parse(s);
        if (j.error) { if (j.code === 401 && token) logout(); const e = new Error(j.error); e.code = j.code; reject(e); } else resolve(j.data);
      })
      .withFailureHandler((e) => reject(new Error((e && e.message) || '연결에 문제가 있습니다.')))
      .handle(token || '', '', method, url, body || {});
  });
}
function toast(m) { if (m === '연타') return; const d = document.createElement('div'); d.className = 'msg'; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 2600); }
// 처리 중에 같은 버튼을 또 눌러도 무시 (연타해도 방/도박이 여러 개 생기지 않게)
const DEV = (() => {   // 이 브라우저의 기기 번호 (한 기기에서 계정을 여러 개 못 만들게 서버에 같이 보냄)
  let d = ''; try { d = LS.get('dev') || ''; } catch { /* 무시 */ }
  if (!/^[A-Za-z0-9]{12,64}$/.test(d)) { d = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, '0')).join(''); try { LS.set('dev', d); } catch { /* 무시 */ } }
  return d;
})();
const guard = (fn) => { let busy = false; return async (...a) => { if (busy) return; busy = true; try { await fn(...a); } catch (e) { toast(e.message); } finally { busy = false; } }; };
function logout() { token = null; user = null; chatMsgs = []; lastChatId = 0; gamesInit = false; watch = { lun: false, lad: false, bbw: false }; LS.del('token'); render(); }

let chatMsgs = [], lastChatId = 0;
let chatBet = null;
let rps = { rooms: [], recent: [] }, listMode = 'all', createMode = 'bet', createHand = null;

// 닉네임 꾸미기: 배지 + 호칭 + 색/효과 (모두 상점에서 구매)
function nm(o, force = {}) {
  const d = { ...o, ...force };
  const cls = d.fx ? ' fx-' + d.fx : '';
  const style = d.color && !d.fx ? ` style="color:${d.color}"` : '';
  return `${d.title ? `<span class="ttl">${esc(d.title)}</span>` : ''}${d.badge ? d.badge + ' ' : ''}<span class="nm${cls}"${style}>${esc(o.name)}</span>`;
}
function renderHeader() {
  $('#who').innerHTML = user ? `${nm(user)} ${user.can_rename ? '<button onclick="rename()" title="닉네임 변경" style="padding:1px 7px;font-size:12px">✏️</button>' : ''} · <span class="pts">${user.points.toLocaleString()}🪙</span> <button onclick="go('rank')" title="방 멤버 보기" style="padding:1px 7px;font-size:12px">👥${user.group_size || 1}</button> <button onclick="logout()" style="padding:2px 8px;font-size:12px">로그아웃</button>` : '';
}
let refreshP = null;
function refresh() {   // 이미 진행 중이면 끝난 뒤 한 번 더 (동작 직후 호출이 옛 데이터로 끝나지 않게). 요청이 쌓이지는 않음
  if (!token) return Promise.resolve();
  if (refreshP) return refreshP = refreshP.then(refreshBody, refreshBody);
  return refreshP = refreshBody().finally(() => { refreshP = null; });
}
async function refreshBody() {
  if (!token) return;                     // 로그인 화면은 다시 그리지 않음 (입력 중 지워짐 방지)
  try {
    ({ me: user, bets, ranking, rps } = await api('GET', '/api/state'));
    notifyRps();
    const np = (user && user.pending_list ? user.pending_list.length : 0);
    if (np > lastPending) toast('가입 승인 요청이 있습니다.');
    lastPending = np;
    await gamesTick();
    const seen = JSON.parse(LS.get('luckySeen') || '[]');
    const fresh = bets.filter((b) => b.my_lucky && !seen.includes(b.id));
    if (fresh.length) { LS.set('luckySeen', JSON.stringify(seen.concat(fresh.map((b) => b.id)))); toast('🍀 럭키 보너스 당첨!!'); }
    if (!$('#app').innerHTML || (tab !== 'new' && tab !== 'chat' && !(document.activeElement && document.activeElement.tagName === 'INPUT'))) render();
    else renderHeader();
  } catch (e) { /* 401 이면 logout 처리됨 */ }
}

function render() {
  if (window.__bbPlaying && tab === 'bets' && listMode === 'bb') { renderHeader(); return; }   // 블록 블라스트를 하는 중에는 화면을 다시 그리지 않음 (끌던 블록이 사라지지 않게)
  renderHeader();
  $('#app').innerHTML = !token ? authView() : user && user.pending ? pendingView() : `
    ${approveCard()}<div class="tabs">${[['bets','🎲 게임'],['new','➕ 만들기'],['casino','🎰 카지노'],['gift','💸 나눔'],['shop','🛍 상점'],['rank','랭킹']].map(([k,l]) => `<button class="t-${k} ${(tab==='chat'?'bets':tab)===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>
    ${user && user.can_aid ? `<div class="card">💸 칩이 거의 없습니다. <button class="pri" onclick="aid()">구제금 100🪙 받기 (하루 1번)</button></div>` : ''}
    ${bodyView()}`;
  if (token && tab === 'chat') { renderChat(); pollChat(); }
  if (token && tab === 'bets' && listMode === 'bb') bbAttach();
}
const go = (k) => { tab = k; if (k === 'shop') loadShop(); render(); loadGame(); };

const pendingView = () => `<div class="card" style="text-align:center"><h2>⏳ 승인 대기 중</h2><div style="font-size:44px;margin:10px 0">🔒</div>
  <p>방장의 승인을 기다리고 있습니다.</p><p class="mute">승인되면 1000🪙이 지급되고 모든 기능을 사용할 수 있습니다. 이 화면은 자동으로 갱신됩니다.</p></div>`;

async function pollChatBody() {
  if (!token || tab !== 'chat' || !chatBet) return;
  const bid = chatBet;
  try {
    const rows = await api('GET', '/api/chat?bet=' + bid + '&after=' + lastChatId);
    if (bid !== chatBet) return;   // 응답이 오는 사이 다른 방으로 옮겼으면 버림
    if (!lastChatId) chatMsgs = []; // 처음 불러올 때는 최근 기록으로 교체
    if (rows.length) { chatMsgs = chatMsgs.concat(rows).slice(-150); lastChatId = rows[rows.length - 1].id; renderChat(); }

  } catch (e) { /* 무시 */ }

const LAD_RULES = `<details %OPEN% class="rules"><summary><b>🪜 사다리타기란 무엇입니까?</b></summary>
  <p>방장이 <b>인원(2~6명)과 판돈</b>을 정하고 방을 열습니다. 사람들이 <b>자리(번호)를 골라 앉습니다.</b> 모두 같은 판돈을 냅니다.</p>

  <p class="mute">사다리는 자리가 다 찬 뒤에야 만들어지니까 미리 알고 고를 수는 없습니다. 어느 자리든 당첨 확률은 똑같이 1/인원수입니다.</p></details>`;
const LCOL = ['#22d3ee', '#ff2d95', '#ffb800', '#34f5a0', '#a855f7', '#ff6b3d'];
function ladderSvg(r) {
  const N = r.slots, R = r.rungs.length, W = Math.max(240, N * 62), H = 250, top = 38, bot = H - 40, gap = (bot - top) / R;
  const x = (i) => 28 + i * (W - 56) / Math.max(1, N - 1), yy = (ri) => top + (ri + 0.5) * gap;
  let g = '';
  for (let i = 0; i < N; i++) g += `<line class="lv" x1="${x(i)}" y1="${top}" x2="${x(i)}" y2="${bot}"/>`;
  r.rungs.forEach((row, ri) => row.forEach((i) => { g += `<line class="lr" x1="${x(i)}" y1="${yy(ri)}" x2="${x(i + 1)}" y2="${yy(ri)}"/>`; }));
  r.seats.forEach((s) => {
    const win = s.end === r.win_end, pts = [[x(s.path[0]), top]];
    for (let ri = 0; ri < R; ri++) { pts.push([x(s.path[ri]), yy(ri)]); pts.push([x(s.path[ri + 1]), yy(ri)]); }
    pts.push([x(s.path[R]), bot]);
    g += `<polyline fill="none" stroke="${LCOL[s.slot % 6]}" stroke-width="${win ? 5 : 3}" stroke-opacity="${win ? 1 : .55}" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((p) => p.join(',')).join(' ')}"/>`;
    g += `<text x="${x(s.slot)}" y="${top - 14}" text-anchor="middle" font-size="11" fill="${LCOL[s.slot % 6]}">${esc(s.name.length > 4 ? s.name.slice(0, 4) + '…' : s.name)}</text>`;
  });
  for (let i = 0; i < N; i++) g += `<text x="${x(i)}" y="${bot + 22}" text-anchor="middle" font-size="${i === r.win_end ? 18 : 12}" fill="${i === r.win_end ? '#ffb800' : '#8d8aa8'}">${i === r.win_end ? '🏆' : '꽝'}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W + 40}px;display:block;margin:6px auto">${g}</svg>`;
}

  if (l.net_cap > 0) parts.push(`오늘 번 🪙 <b class="${netCls(l.net_today)}">${netText(l.net_today)}</b> / 하루 최대 +${l.net_cap}🪙 <span class="mute">(남은 한도 ${l.remaining}🪙)</span>`);
  if (l.plays_cap > 0) parts.push(`오늘 한 판 ${l.plays_today} / ${l.plays_cap}번`);
  const warn = l.blocked === 'net' ? '오늘 번 🪙이 한도에 도달했습니다! 내일 한국 시간 자정 이후에 다시 할 수 있습니다.' : l.blocked === 'plays' ? '오늘 할 수 있는 횟수를 다 썼습니다. 내일 다시 합니다.' : '';
  return `<div class="limit">${parts.join('<br>')}${warn ? `<div class="lose" style="margin-top:4px">${warn}</div>` : ''}<div class="mute">블랙잭·슬롯·블록 블라스트를 합쳐서 계산하고, 매일 한국 시간 자정에 초기화됩니다.</div></div>`;
}

const spinSlots = guard(async () => {
  if (slotUi.busy) return;

  slotUi.busy = true; slotUi.msg = ''; slotUi.bet = bet;
  const t = setInterval(() => { document.querySelectorAll('.reel').forEach((e) => { e.textContent = syms[Math.floor(Math.random() * syms.length)]; }); }, 70);
  try {
    const [r] = await Promise.all([api('POST', '/api/slots/spin', { bet }), new Promise((res) => setTimeout(res, 800))]);
    slotUi.reels = r.reels;
    slotUi.msg = (r.mult > 0 ? `당첨! ×${r.mult} ${netText(r.net)}` : `아쉽습니다 ${netText(r.net)}`) + (r.capped ? ' · 오늘 한도까지만 지급' : ''); slotUi.cls = r.net > 0 ? 'win' : r.net < 0 ? 'lose' : 'mute';

let shop = [], shopLoaded = false;
const loadShop = guard(async () => { shop = await api('GET', '/api/shop'); shopLoaded = true; if (tab === 'shop') render(); });
const SLOTS = [['title', '호칭', '이름 앞에 붙는 칭호'], ['color', '닉네임 색', '글자 색'], ['fx', '닉네임 효과', '효과가 있으면 색보다 우선'], ['badge', '배지', '이름 앞 이모지']];
function shopView() {
  if (!shopLoaded) return '<p class="mute">불러오는 중…</p>';
  if (!shop.length) return `<div class="card" style="text-align:center"><h2>🛍 상점</h2><div style="font-size:44px;margin:10px 0">🔒</div><p>상점은 지금 <b>준비 중</b>입니다.</p><p class="mute">호칭, 닉네임 색, 배지 같은 꾸미기 아이템을 곧 열 거입니다. 조금만 기다려주십시오!</p></div>`;
  const preview = (i) => nm(user, { [i.slot]: i.value });
  return `<div class="card"><h2>🛍 상점</h2><div class="mute">내 모습: ${nm(user)} · 보유 <span class="pts">${user.points.toLocaleString()}🪙</span></div>
  <p class="mute">사면 바로 장착됩니다. 칸마다 하나씩 장착할 수 있고, 한 번 산 건 언제든 바꿔 낄 수 있습니다.</p></div>` +
  SLOTS.map(([slot, label, hint]) => `<div class="card"><h2>${label}</h2><div class="mute">${hint}</div>
    <div class="items">${shop.filter((i) => i.slot === slot).map((i) => `<div class="item ${i.equipped ? 'eq' : ''}">
      <div class="pv">${preview(i)}</div><div class="mute">${esc(i.name)}</div>
      ${i.equipped ? `<button onclick="unequip('${slot}')">해제</button>`
        : i.owned ? `<button class="pri" onclick="equip('${i.id}')">장착</button>`
        : `<button class="pri" ${user.points < i.price ? 'disabled' : ''} onclick="buy('${i.id}')">${i.price.toLocaleString()}🪙</button>`}</div>`).join('')}</div></div>`).join('');
}
const afterShop = async () => { await loadShop(); await refresh(); };
const buy = guard(async (id) => { await api('POST', '/api/shop/buy', { item_id: id }); toast('구매 완료! ✨'); await afterShop(); });
const equip = guard(async (id) => { await api('POST', '/api/shop/equip', { item_id: id }); await afterShop(); });
const unequip = guard(async (slot) => { await api('POST', '/api/shop/equip', { item_id: null, slot }); await afterShop(); });

function rankView() {
  return `${user && user.room ? `<div class="card"><div class="row"><span>🚪 내 방 코드 <b style="color:var(--cyan)">${esc(user.room)}</b></span><span class="mute">${user.group_size}명 · 상대에게 이 코드를 알려주십시오</span></div>
    <div class="mute" style="margin-top:8px">👥 멤버</div><div class="members">${ranking.map((r) => `<span class="member ${r.name === user.name ? 'me' : ''}">${nm(r)}${user.is_owner && r.name !== user.name ? ` <button class="kick" title="추방" onclick="kick(${r.id})">✕</button>` : ''}</span>`).join('') || '<span class="mute">아직 나뿐입니다</span>'}</div></div>` : ''}<div class="card"><h2>랭킹</h2><table><tr><th>#</th><th>이름</th><th>승</th><th>패</th><th>🪙</th></tr>${ranking.map((r, i) =>
    `<tr><td>${i + 1}</td><td>${nm(r)}</td><td>${r.wins}</td><td>${r.losses}</td><td><b>${r.points.toLocaleString()}🪙</b></td></tr>`).join('')}</table></div>`;
}

(async () => {
  render(); refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 8000);
})();

// 글자 🪙 → 게임칩 (화면에 새로 들어오는 글자마다 바꿈)
(function () {
  const walk = (root) => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), hits = [];
    for (let n = w.nextNode(); n; n = w.nextNode()) if (n.nodeValue.includes('🪙') && !/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)) hits.push(n);
    for (const n of hits) {
      const parts = n.nodeValue.split('🪙'), f = document.createDocumentFragment();
      parts.forEach((t, i) => { if (i) { const c = document.createElement('i'); c.className = 'chip'; f.append(c); } if (t) f.append(t); });
      n.replaceWith(f);
    }
  };
  new MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) { if (n.nodeType === 1) walk(n); else if (n.nodeType === 3 && n.parentNode && n.nodeValue.includes('🪙')) walk(n.parentNode); } })
    .observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
</body>
