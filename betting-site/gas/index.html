<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도박장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0e0e16;--ink:#f3f1ff;--mute:#8d8aa8;--line:#25233a;--pri:#a855f7;--pink:#ff2d95;--cyan:#22d3ee;--win:#34f5a0;--lose:#ff4d6d;--dog:#ffb800}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font:16px/1.5 'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;min-height:100vh;
 background-image:radial-gradient(600px 300px at 10% -5%,rgba(168,85,247,.28),transparent),radial-gradient(500px 300px at 95% 5%,rgba(255,45,149,.2),transparent),radial-gradient(500px 400px at 50% 110%,rgba(34,211,238,.14),transparent);background-attachment:fixed}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:20px;background:linear-gradient(90deg,var(--cyan),var(--pri),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 8px rgba(168,85,247,.6))}
.pts{font-weight:800;color:var(--dog);text-shadow:0 0 10px rgba(255,184,0,.7)}
.card{position:relative;background:linear-gradient(160deg,#14141f,var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0;box-shadow:0 0 0 1px rgba(168,85,247,.08),0 8px 30px rgba(168,85,247,.12);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(168,85,247,.5),0 10px 36px rgba(255,45,149,.2)}
h2{font-size:18px;margin:0 0 4px}.mute{color:var(--mute);font-size:13px}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:10px 12px;background:#07070c;color:var(--ink);outline:none}
input{width:100%;margin:4px 0}input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(168,85,247,.25)}
button{cursor:pointer;transition:transform .1s,filter .15s}button:hover:not(:disabled){filter:brightness(1.25)}button:active:not(:disabled){transform:scale(.96)}
button.pri{background:linear-gradient(90deg,var(--pri),var(--pink));border:0;color:#fff;font-weight:700;box-shadow:0 0 16px rgba(255,45,149,.45)}
button:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;font-weight:600}
.tabs .on{background:linear-gradient(90deg,var(--cyan),var(--pri));color:#000;border:0;box-shadow:0 0 16px rgba(34,211,238,.5)}
.opt{margin:12px 0;padding:8px 10px;border-radius:12px;border:1px solid transparent}
.bar{height:10px;background:#1a1a28;border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pri));box-shadow:0 0 12px var(--pri);transition:width .5s}
.opt.dog{border-color:rgba(255,184,0,.45);background:rgba(255,184,0,.06);animation:glow 2s infinite}
.opt.dog .bar i{background:linear-gradient(90deg,var(--dog),var(--pink));box-shadow:0 0 12px var(--dog)}
.opt.won{border-color:var(--win);background:rgba(52,245,160,.07);box-shadow:0 0 18px rgba(52,245,160,.3)}
.opt.won .bar i{background:linear-gradient(90deg,var(--win),var(--cyan));box-shadow:0 0 12px var(--win)}
@keyframes glow{50%{box-shadow:0 0 16px rgba(255,184,0,.35)}}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:linear-gradient(90deg,var(--dog),var(--pink));color:#000;margin-left:6px;vertical-align:middle}
.tag.s{background:#26243a;color:var(--cyan)}
.win{color:var(--win);font-weight:800;text-shadow:0 0 10px rgba(52,245,160,.6)}.lose{color:var(--lose);font-weight:800}
.lucky{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:99px;font-weight:800;color:#000;background:linear-gradient(90deg,#fff176,#ffb800,#ff8a3d);box-shadow:0 0 14px rgba(255,184,0,.8)}
.betrow{display:flex;gap:6px;margin-top:6px}.betrow input{margin:0}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--pri),var(--pink));color:#fff;font-weight:700;padding:10px 18px;border-radius:12px;z-index:9;max-width:90%;box-shadow:0 0 24px rgba(255,45,149,.6)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}td:nth-child(n+3),th:nth-child(n+3){text-align:right}
tr:nth-child(2) td:first-child{color:#ffd700}tr:nth-child(3) td:first-child{color:#c0c0c0}tr:nth-child(4) td:first-child{color:#cd7f32}
tr:nth-child(2){background:rgba(255,215,0,.07)}

/* ---- 더 화려하게 ---- */
:root{--c0:#22d3ee;--c1:#ff2d95;--c2:#ffb800;--c3:#34f5a0;--c4:#a855f7;--c5:#ff6b3d}
header b{font-size:22px;letter-spacing:.5px}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,#22d3ee,#a855f7,#ff2d95)}
.card h2{color:var(--ink)}   /* 그라데이션 글자는 이모지를 실루엣으로 덮어서 단색으로 */
.opt{--c:var(--c0);border-color:color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 7%,transparent)}
.opt .bar i{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));box-shadow:0 0 14px var(--c)}
.opt .lbl{color:var(--c);font-weight:700;text-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent)}
.opt.dog .bar i{background:linear-gradient(90deg,var(--dog),var(--pink))}
.opt.won .bar i{background:linear-gradient(90deg,var(--win),var(--cyan))}
.opt button.pri{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,var(--pink)));box-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent);color:#000}



.tabs button{border-width:2px}

.tag.s{background:linear-gradient(90deg,#22d3ee33,#a855f733);color:#e9d5ff;border:1px solid #a855f777}

.tabs button{padding:10px 4px}

#chatbox{height:50vh;overflow-y:auto;padding:6px;margin:8px 0;background:#07070c;border:1px solid var(--line);border-radius:12px}
.cm{margin:8px 0;max-width:85%}.cm.me{margin-left:auto;text-align:right}
.cn{font-size:12px;font-weight:700}.cn span{color:var(--mute);font-weight:400;margin-left:4px}
.cb{display:inline-block;padding:6px 12px;border-radius:14px;background:#1b1b2b;word-break:break-word;text-align:left}
.cm.me .cb{background:linear-gradient(90deg,var(--pri),var(--pink));color:#fff}
button{white-space:nowrap}header{flex-wrap:wrap}header #who{font-size:14px}

.tabs button{font-size:13px;padding:10px 2px}


.ttl{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;margin-right:5px;border-radius:99px;color:#000;background:linear-gradient(90deg,#ffb800,#ff2d95);vertical-align:middle}
.nm{font-weight:700}
.nm.fx-glow{color:#fff;text-shadow:0 0 6px #22d3ee,0 0 14px #a855f7,0 0 24px #ff2d95}
.nm.fx-fire{background:linear-gradient(0deg,#ff2d00,#ffb800,#fff176);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(255,100,0,.8))}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.item{background:#07070c;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item.eq{border-color:var(--win);box-shadow:0 0 14px rgba(52,245,160,.35)}.item .pv{min-height:26px}
.item button{width:100%}

.tabs.mode{margin:4px 0 8px}.tabs.mode button{font-size:14px;padding:9px 6px}
.tabs.mode button.on{background:linear-gradient(90deg,#ff6b3d,#ff2d95);box-shadow:0 0 16px rgba(255,107,61,.5);color:#fff}
.room{background:#07070c;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.room.mine{border-color:var(--dog);background:rgba(255,184,0,.06)}
.hands{display:flex;gap:8px;margin-top:8px}
.hand{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;padding:10px 4px;border-width:2px}
.hand span{font-size:30px;line-height:1.1}
.hands.pick{margin:12px 0}.hand.sel{border-color:var(--win);background:rgba(52,245,160,.12);box-shadow:0 0 16px rgba(52,245,160,.45)}
.rec{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.rec.me{background:rgba(168,85,247,.08)}



.tabs.mode button:nth-child(n){border-color:var(--line)}.tabs.mode button.on{border-color:transparent}
.card.done{opacity:.5;transition:opacity .15s}.card.done:hover{opacity:.9;transform:none}

.tabs button.t-bets.on{background:linear-gradient(90deg,#22d3ee,#34f5a0);box-shadow:0 0 16px rgba(34,211,238,.45)}.tabs button.t-bets{border-color:#22d3ee55}
.tabs button.t-new.on{background:linear-gradient(90deg,#ff2d95,#ffb800);box-shadow:0 0 16px rgba(255,45,149,.5)}.tabs button.t-new{border-color:#ff2d9555}
.tabs button.t-casino.on{background:linear-gradient(90deg,#ff6b3d,#ff2d95);box-shadow:0 0 16px rgba(255,107,61,.5)}.tabs button.t-casino{border-color:#ff6b3d55}
.tabs button.t-shop.on{background:linear-gradient(90deg,#ffb800,#ff2d95);box-shadow:0 0 16px rgba(255,184,0,.5)}.tabs button.t-shop{border-color:#ffb80055}
.tabs button.t-rank.on{background:linear-gradient(90deg,#34f5a0,#22d3ee);box-shadow:0 0 16px rgba(52,245,160,.5)}.tabs button.t-rank{border-color:#34f5a055}
.tabs:not(.mode) button{font-size:13px;padding:10px 2px;border-width:2px}
.tabs.mode{flex-wrap:wrap}.tabs.mode button{flex:1 1 calc(50% - 6px);font-size:14px;padding:9px 6px}
.tabs.mode button.on{background:linear-gradient(90deg,#ff6b3d,#ff2d95);box-shadow:0 0 16px rgba(255,107,61,.5);color:#fff;border-color:transparent}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.nums.n4{grid-template-columns:repeat(4,1fr)}.nums.n5{grid-template-columns:repeat(5,1fr)}.nums.n6{grid-template-columns:repeat(3,1fr)}
.num{padding:10px 0;font-weight:800;font-size:16px;border-width:2px}.num.sel{border-color:var(--win);background:rgba(52,245,160,.15);box-shadow:0 0 14px rgba(52,245,160,.4)}
.seats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seat{padding:6px 12px;border-radius:99px;border:1px dashed var(--line);font-size:13px;color:var(--mute)}.seat.on{border-style:solid;color:var(--ink);background:#1b1b2b}.seat.mine{border-color:var(--win)}
button.seat.free{border-style:solid;border-color:var(--cyan);color:var(--cyan);cursor:pointer}
.pn{display:inline-block;padding:1px 9px;border-radius:99px;background:#1b1b2b;margin:2px;font-size:13px;border:1px solid transparent}.pn.uq{border-color:var(--cyan)}.pn.win{background:rgba(52,245,160,.2);border-color:var(--win)}
.card.sub{padding:10px}.card.sub.me{border-color:var(--pri)}
.lv,.lr{stroke:#3a3856;stroke-width:3;stroke-linecap:round}
.rules p,.rules ul,.rules ol{margin:6px 0}.rules li{margin:4px 0}.rules summary{cursor:pointer;font-size:16px}.rules b{color:var(--cyan)}.rules ul,.rules ol{padding-left:20px}
.hand-row{display:flex;flex-wrap:wrap;margin:4px 0}
.pc{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:60px;margin:3px;border-radius:8px;background:#f5f5fa;color:#111;font-weight:800;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pc.red{color:#d92d3a}.pc.back{background:repeating-linear-gradient(45deg,#3b2a8c,#3b2a8c 6px,#2a1f66 6px,#2a1f66 12px);color:#fff}
.reels{display:flex;gap:8px;justify-content:center;margin:14px 0}.reel{width:78px;height:78px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#07070c;border:2px solid var(--line);border-radius:14px}
.limit{background:#07070c;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 0}

/* 글꼴: 본문은 Noto Sans KR, 로고·제목·점수는 Black Han Sans (구글 폰트가 안 불러와져도 기본 글꼴로 보임) */
:root{--display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif}
header b,.card h2,.pts{font-family:var(--display);font-weight:400;letter-spacing:.3px}
header b{font-size:24px}.card h2{font-size:20px}
.lg{display:flex;align-items:center;gap:8px}.dice{font-size:24px;line-height:1}   /* 이모지는 그라데이션 글자 바깥에 둬야 색이 살아요 */
.card h2 .mute{font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:400;letter-spacing:0}
</style>
</head>
<body>
<header><span class="lg"><span class="dice">🎲</span><b>도박장</b></span><span id="who"></span></header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { // 앱스 스크립트 화면에서는 저장소가 막힐 수 있어 안전하게 감쌈
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* 무시 */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* 무시 */ } },
};
let token = LS.get('token'), user = null, tab = 'bets', bets = [], ranking = [], busy = false;

function api(method, url, body) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler((s) => {
        const j = JSON.parse(s);
        if (j.error) { if (j.code === 401 && token) logout(); const e = new Error(j.error); e.code = j.code; reject(e); } else resolve(j.data);
      })
      .withFailureHandler((e) => reject(new Error((e && e.message) || '연결에 문제가 있어요.')))
      .handle(token || '', '', method, url, body || {});
  });
}
function toast(m) { const d = document.createElement('div'); d.className = 'msg'; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 2600); }
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };
function logout() { token = null; user = null; chatMsgs = []; lastChatId = 0; gamesInit = false; watch = { lun: false, lad: false }; LS.del('token'); render(); }

let chatMsgs = [], lastChatId = 0;
let chatBet = null;
let rps = { rooms: [], recent: [] }, listMode = 'bets', createMode = 'bet', createHand = null;

// 닉네임 꾸미기: 배지 + 호칭 + 색/효과 (모두 상점에서 구매)
function nm(o, force = {}) {
  const d = { ...o, ...force };
  const cls = d.fx ? ' fx-' + d.fx : '';
  const style = d.color && !d.fx ? ` style="color:${d.color}"` : '';
  return `${d.title ? `<span class="ttl">${esc(d.title)}</span>` : ''}${d.badge ? d.badge + ' ' : ''}<span class="nm${cls}"${style}>${esc(o.name)}</span>`;
}
function renderHeader() {
  $('#who').innerHTML = user ? `${nm(user)} <button onclick="rename()" title="닉네임 변경" style="padding:1px 7px;font-size:12px">✏️</button> · <span class="pts">${user.points.toLocaleString()}점</span> <span class="mute" title="같은 PIN으로 들어온 사람 수">👥${user.group_size || 1}</span> <button onclick="logout()" style="padding:2px 8px;font-size:12px">로그아웃</button>` : '';
}
async function refresh() {
  if (!token) return;                     // 로그인 화면은 다시 그리지 않음 (입력 중 지워짐 방지)
  try {
    ({ me: user, bets, ranking, rps } = await api('GET', '/api/state'));
    notifyRps();
    await gamesTick();
    const seen = JSON.parse(LS.get('luckySeen') || '[]');
    const fresh = bets.filter((b) => b.my_lucky && !seen.includes(b.id));
    if (fresh.length) { LS.set('luckySeen', JSON.stringify(seen.concat(fresh.map((b) => b.id)))); toast('🍀 럭키 보너스 당첨!!'); }
    if (!$('#app').innerHTML || (tab !== 'new' && tab !== 'chat' && !(document.activeElement && document.activeElement.tagName === 'INPUT'))) render();
    else renderHeader();
  } catch (e) { /* 401 이면 logout 처리됨 */ }
}

function render() {
  renderHeader();
  $('#app').innerHTML = !token ? authView() : `
    <div class="tabs">${[['bets','도박'],['new','만들기'],['casino','🎰 카지노'],['shop','🛍 상점'],['rank','랭킹']].map(([k,l]) => `<button class="t-${k} ${(tab==='chat'?'bets':tab)===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>
    ${user && user.can_aid ? `<div class="card">💸 포인트가 거의 없네요. <button class="pri" onclick="aid()">구제금 100점 받기 (하루 1번)</button></div>` : ''}
    ${bodyView()}`;
  if (token && tab === 'chat') { renderChat(); pollChat(); }
}
const go = (k) => { tab = k; if (k === 'shop') loadShop(); render(); loadGame(); };

function authView() {
  return `<div class="card"><h2>들어가기</h2><p class="mute">닉네임 + 숫자 4자리 PIN으로 들어와요. 처음 쓰는 닉네임이면 새 계정이 만들어지고 1000점이 지급돼요! <b>PIN이 같은 사람들끼리만</b> 같은 방에서 도박·가위바위보·채팅을 해요. 이기면 낮은 확률로 🍀 럭키 보너스도 터져요. (실제 돈과 무관한 사이트 전용 포인트)</p>
  <input id="n" placeholder="닉네임" maxlength="12"><input id="p" placeholder="PIN 4자리" inputmode="numeric" maxlength="4" type="password" onkeydown="if(event.key==='Enter')auth()">
  <div class="betrow"><button class="pri" style="flex:1" onclick="auth()">시작하기</button></div></div>`;
}
const auth = guard(async () => {
  const body = { name: $('#n').value, pin: $('#p').value };
  let r = await api('POST', '/api/enter', body);
  if (r.new_user) {   // 없는 닉네임이면 새 계정 — 오타일 수 있어서 한 번 확인
    if (!confirm(`'${body.name.trim()}' 닉네임으로 새로 시작할까요? (1000점 지급)\n\nPIN이 같은 사람들끼리만 같은 방에서 해요. 이 PIN으로 처음 들어오는 게 맞나요?\n(이미 계정이 있다면 닉네임이나 PIN을 잘못 입력한 걸 수 있어요.)`)) return;
    r = await api('POST', '/api/enter', { ...body, create: true });
  }
  token = r.token; LS.set('token', token); render(); await refresh();
});
const rename = guard(async () => {
  const n = prompt('새 닉네임 (12자 이내)', user.name);
  if (n === null || !n.trim() || n.trim() === user.name) return;
  await api('POST', '/api/nickname', { name: n }); toast('닉네임이 바뀌었어요!'); await refresh();
});

/* ---------- 채팅 ---------- */
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const openChat = (betId) => { chatBet = betId; chatMsgs = []; lastChatId = 0; tab = 'chat'; render(); window.scrollTo(0, 0); };
function chatView() {
  const b = bets.find((x) => x.id === chatBet);
  if (!b) return `<div class="card"><p class="mute">이 도박을 찾을 수 없어요.</p><button onclick="go('bets')">← 목록으로</button></div>`;
  return `<div class="card"><div class="row"><button onclick="go('bets')">← 목록</button><span class="mute">${statusText(b)} · 총 ${b.total}점</span></div>
  <h2 style="margin-top:8px">💬 ${esc(b.title)}</h2><div class="mute">이 도박을 보고 있는 사람들끼리 이야기해요.</div><div id="chatbox"></div>

function ladderSvg(r) {
  const N = r.slots, R = r.rungs.length, W = Math.max(240, N * 62), H = 250, top = 38, bot = H - 40, gap = (bot - top) / R;

  let g = '';

  r.rungs.forEach((row, ri) => row.forEach((i) => { g += `<line class="lr" x1="${x(i)}" y1="${yy(ri)}" x2="${x(i + 1)}" y2="${yy(ri)}"/>`; }));
  r.seats.forEach((s) => {
    const win = s.end === r.win_end, pts = [[x(s.path[0]), top]];
    for (let ri = 0; ri < R; ri++) { pts.push([x(s.path[ri]), yy(ri)]); pts.push([x(s.path[ri + 1]), yy(ri)]); }
    pts.push([x(s.path[R]), bot]);
    g += `<polyline fill="none" stroke="${LCOL[s.slot % 6]}" stroke-width="${win ? 5 : 3}" stroke-opacity="${win ? 1 : .55}" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((p) => p.join(',')).join(' ')}"/>`;

  });
  for (let i = 0; i < N; i++) g += `<text x="${x(i)}" y="${bot + 22}" text-anchor="middle" font-size="${i === r.win_end ? 18 : 12}" fill="${i === r.win_end ? '#ffb800' : '#8d8aa8'}">${i === r.win_end ? '🏆' : '꽝'}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W + 40}px;display:block;margin:6px auto">${g}</svg>`;
}

function slotTable() {
  if (!slotData) return '<p class="mute">불러오는 중…</p>';
  const d = slotData, pay = d.symbols.map((s, i) => `<div class="row"><span style="font-size:20px">${s}${s}${s}</span><b class="pts">×${d.triple[i]}</b></div>`).join('');
  const rec = d.recent.length ? d.recent.map((r) => `<div class="rec"><span>${r.reels.join(' ')}</span><span class="mute">${r.bet}점</span><b class="${netCls(r.net)}">${netText(r.net)}</b></div>`).join('') : '<p class="mute">아직 기록이 없어요.</p>';
  return `<div class="card"><h2>🎰 슬롯머신</h2><div class="mute">버튼을 누르면 릴 3개가 돌아가요. 건 돈 ${d.min}~${d.max}점.</div>
    ${soloBar(d.limits)}<div class="reels">${slotUi.reels.map((s) => `<div class="reel">${s}</div>`).join('')}</div>
    ${slotUi.msg ? `<p class="${slotUi.cls}" style="text-align:center;font-size:18px;margin:4px 0 10px">${slotUi.msg}</p>` : ''}
    <div class="betrow"><input id="sbet" type="number" min="${d.min}" max="${d.max}" step="10" value="${slotUi.bet || 50}"><button class="pri" onclick="spinSlots()" ${slotUi.busy || (d.limits && d.limits.blocked) ? 'disabled' : ''}>🎰 돌리기</button></div></div>
    <div class="card"><h2>배당표 <span class="mute">(건 돈의 몇 배를 돌려받는지)</span></h2>${pay}
    <div class="row"><span style="font-size:20px">🍒🍒 <span class="mute" style="font-size:13px">(🍒 정확히 2개)</span></span><b class="pts">×${d.cherry2}</b></div>
    <div class="row"><span style="font-size:20px">🍒 <span class="mute" style="font-size:13px">(🍒 정확히 1개)</span></span><b class="pts">×${d.cherry1}</b></div>
    <p class="mute">그 외 조합은 꽝이에요. 그림이 나올 가능성은 🍒가 가장 높고 7️⃣이 가장 낮아요. 오래 하면 평균적으로 건 돈의 약 91%를 돌려받아요(딜러가 조금 유리해요). 당첨금은 소수점 이하를 버려요.</p></div>
    <div class="card"><h2>내 최근 기록</h2>${rec}</div>`;
}
const spinSlots = guard(async () => {
  if (slotUi.busy) return;
  const bet = Number($('#sbet').value), syms = slotData.symbols;
  slotUi.busy = true; slotUi.msg = ''; slotUi.bet = bet;
  const t = setInterval(() => { document.querySelectorAll('.reel').forEach((e) => { e.textContent = syms[Math.floor(Math.random() * syms.length)]; }); }, 70);
  try {
    const [r] = await Promise.all([api('POST', '/api/slots/spin', { bet }), new Promise((res) => setTimeout(res, 800))]);
    slotUi.reels = r.reels;
    slotUi.msg = (r.mult > 0 ? `당첨! ×${r.mult} ${netText(r.net)}` : `아쉬워요 ${netText(r.net)}`) + (r.capped ? ' · 오늘 한도까지만 지급' : ''); slotUi.cls = r.net > 0 ? 'win' : r.net < 0 ? 'lose' : 'mute';
  } finally { clearInterval(t); slotUi.busy = false; }
  await refresh(); try { slotData = await api('GET', '/api/slots'); } catch (e) { /* 무시 */ } render();
});

/* ---- 화면 조립 ---- */
function bodyView() {
  if (tab === 'bets') return modeToggle(listMode, 'setListMode') + (listMode === 'rps' ? rpsLobby() : listMode === 'lun' ? lunLobby() : listMode === 'lad' ? ladLobby() : (sortBets(bets).map(betView).join('') || '<p class="mute">아직 도박이 없어요. 하나 열어보세요!</p>'));
  if (tab === 'new') return modeToggle(createMode, 'setCreateMode') + ({ bet: newView, rps: rpsCreateView, lun: lunCreateView, lad: ladCreateView }[createMode] || newView)();
  if (tab === 'casino') return `<div class="mute" style="margin:0 2px 6px">딜러(서버)와 혼자 하는 게임이에요. 이기면 점수가 새로 생기고 지면 사라져요.</div>` + modeToggle(casinoMode, 'setCasinoMode') + (casinoMode === 'slots' ? slotTable() : bjTable());
  if (tab === 'chat') return chatView();
  if (tab === 'shop') return shopView();
  return rankView();
}

let shop = [], shopLoaded = false;
const loadShop = guard(async () => { shop = await api('GET', '/api/shop'); shopLoaded = true; if (tab === 'shop') render(); });
const SLOTS = [['title', '호칭', '이름 앞에 붙는 칭호'], ['color', '닉네임 색', '글자 색'], ['fx', '닉네임 효과', '효과가 있으면 색보다 우선'], ['badge', '배지', '이름 앞 이모지']];
function shopView() {
  if (!shopLoaded) return '<p class="mute">불러오는 중…</p>';
  if (!shop.length) return `<div class="card" style="text-align:center"><h2>🛍 상점</h2><div style="font-size:44px;margin:10px 0">🔒</div><p>상점은 지금 <b>준비 중</b>이에요.</p><p class="mute">호칭, 닉네임 색, 배지 같은 꾸미기 아이템을 곧 열 거예요. 조금만 기다려주세요!</p></div>`;
  const preview = (i) => nm(user, { [i.slot]: i.value });
  return `<div class="card"><h2>🛍 상점</h2><div class="mute">내 모습: ${nm(user)} · 보유 <span class="pts">${user.points.toLocaleString()}점</span></div>
  <p class="mute">사면 바로 장착돼요. 칸마다 하나씩 장착할 수 있고, 한 번 산 건 언제든 바꿔 낄 수 있어요.</p></div>` +
  SLOTS.map(([slot, label, hint]) => `<div class="card"><h2>${label}</h2><div class="mute">${hint}</div>
    <div class="items">${shop.filter((i) => i.slot === slot).map((i) => `<div class="item ${i.equipped ? 'eq' : ''}">
      <div class="pv">${preview(i)}</div><div class="mute">${esc(i.name)}</div>
      ${i.equipped ? `<button onclick="unequip('${slot}')">해제</button>`
        : i.owned ? `<button class="pri" onclick="equip('${i.id}')">장착</button>`
        : `<button class="pri" ${user.points < i.price ? 'disabled' : ''} onclick="buy('${i.id}')">${i.price.toLocaleString()}점</button>`}</div>`).join('')}</div></div>`).join('');
}
const afterShop = async () => { await loadShop(); await refresh(); };
const buy = guard(async (id) => { await api('POST', '/api/shop/buy', { item_id: id }); toast('구매 완료! ✨'); await afterShop(); });
const equip = guard(async (id) => { await api('POST', '/api/shop/equip', { item_id: id }); await afterShop(); });
const unequip = guard(async (slot) => { await api('POST', '/api/shop/equip', { item_id: null, slot }); await afterShop(); });

function rankView() {
  return `<div class="card"><h2>랭킹</h2><table><tr><th>#</th><th>이름</th><th>승</th><th>패</th><th>점수</th></tr>${ranking.map((r, i) =>
    `<tr><td>${i + 1}</td><td>${nm(r)}</td><td>${r.wins}</td><td>${r.losses}</td><td><b>${r.points.toLocaleString()}</b></td></tr>`).join('')}</table></div>`;
}

(async () => {
  render(); refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 8000);
})();
</script>
</body>
</html>
