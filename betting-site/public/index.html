<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>친구 내기판</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c1e26;--mute:#6b7080;--line:#e4e6ee;--pri:#5b5bf0;--win:#16a34a;--lose:#dc2626;--dog:#f59e0b}
@media (prefers-color-scheme:dark){:root{--bg:#14151b;--card:#1e2028;--ink:#eceef5;--mute:#9aa0b3;--line:#2e313c;--pri:#8585ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Noto Sans KR',sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:18px}.pts{font-weight:700;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:17px;margin:0 0 4px}.mute{color:var(--mute);font-size:13px}
input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px 12px;background:var(--card);color:var(--ink)}
input{width:100%;margin:4px 0}button{cursor:pointer}button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}.tabs .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt{margin:10px 0}.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--pri)}
.opt.dog .bar i{background:var(--dog)}.opt.won .bar i{background:var(--win)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tag{font-size:12px;padding:1px 7px;border-radius:99px;background:var(--dog);color:#fff;margin-left:6px}
.tag.s{background:var(--mute)}.win{color:var(--win);font-weight:700}.lose{color:var(--lose);font-weight:700}
.betrow{display:flex;gap:6px;margin-top:6px}.betrow input{margin:0}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;max-width:90%}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}td:nth-child(n+3),th:nth-child(n+3){text-align:right}
</style>
</head>
<body>
<header><b>🎲 친구 내기판</b><span id="who"></span></header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = localStorage.getItem('token'), user = null, tab = 'bets', bets = [], ranking = [], busy = false;

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) { if (r.status === 401 && token) logout(); throw new Error(j.error || '오류'); }
  return j;
}
function toast(m) { const d = document.createElement('div'); d.className = 'msg'; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 2600); }
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };
function logout() { token = null; user = null; localStorage.removeItem('token'); render(); }

async function refresh() {
  if (!token) return render();
  if (document.activeElement && document.activeElement.tagName === 'INPUT' && tab === 'bets') return; // 입력 중엔 갱신 안 함
  try {
    [user, bets, ranking] = await Promise.all([api('GET', '/api/me'), api('GET', '/api/bets'), api('GET', '/api/ranking')]);
    render();
  } catch (e) { /* 401 이면 logout 처리됨 */ }
}

function render() {
  $('#who').innerHTML = user ? `${esc(user.name)} · <span class="pts">${user.points.toLocaleString()}점</span> <button onclick="logout()" style="padding:2px 8px;font-size:12px">로그아웃</button>` : '';
  $('#app').innerHTML = !token ? authView() : `
    <div class="tabs">${[['bets','내기'],['new','내기 열기'],['rank','랭킹']].map(([k,l]) => `<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>
    ${user && user.can_aid ? `<div class="card">💸 포인트가 거의 없네요. <button class="pri" onclick="aid()">구제금 100점 받기 (하루 1번)</button></div>` : ''}
    ${tab === 'bets' ? bets.map(betView).join('') || '<p class="mute">아직 내기가 없어요. 하나 열어보세요!</p>' : tab === 'new' ? newView() : rankView()}`;
}

function authView() {
  return `<div class="card"><h2>들어가기</h2><p class="mute">닉네임 + 숫자 4자리 PIN. 처음이면 가입하면 1000점 지급! (실제 돈과 무관한 사이트 전용 포인트)</p>
  <input id="n" placeholder="닉네임" maxlength="12"><input id="p" placeholder="PIN 4자리" inputmode="numeric" maxlength="4" type="password">
  <div class="betrow"><button class="pri" style="flex:1" onclick="auth('login')">로그인</button><button style="flex:1" onclick="auth('signup')">가입</button></div></div>`;
}
const auth = guard(async (kind) => {
  const r = await api('POST', '/api/' + kind, { name: $('#n').value, pin: $('#p').value });
  token = r.token; localStorage.setItem('token', token); await refresh();
});

function statusText(b) {
  if (b.status === 'open') return b.closes_at ? '마감 ' + new Date(b.closes_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '진행 중';
  return { closed: '마감됨 (결과 대기)', resolved: '결과 확정', cancelled: '취소/환불' }[b.status];
}
function betView(b) {
  const open = b.status === 'open';
  const opts = b.options.map((o) => `
    <div class="opt ${o.underdog && b.status !== 'resolved' ? 'dog' : ''} ${b.winner === o.id ? 'won' : ''}">
      <div class="row"><span>${b.winner === o.id ? '🏆 ' : ''}${esc(o.label)}${o.underdog && !b.winner ? '<span class="tag">역배</span>' : ''}${o.my_amount ? `<span class="tag s">내 ${o.my_amount}점</span>` : ''}</span>
        <span class="mute">${o.pool}점 · ${o.bettors}명 · ${o.multiplier ? '×' + o.multiplier : '-'}</span></div>
      <div class="bar"><i style="width:${Math.round(o.share * 100)}%"></i></div>
      ${open ? `<div class="betrow"><input id="a${o.id}" type="number" min="10" step="10" placeholder="걸 점수" ${b.options.some(x => x.id !== o.id && x.my_amount) ? 'disabled' : ''}><button class="pri" onclick="wager(${o.id})" ${b.options.some(x => x.id !== o.id && x.my_amount) ? 'disabled' : ''}>걸기</button></div>` : ''}
      ${b.status === 'closed' && b.mine_created ? `<button onclick="act(${b.id},'resolve',${o.id})">이게 정답!</button>` : ''}
    </div>`).join('');
  let result = '';
  if (b.my_total && (b.status === 'resolved' || b.status === 'cancelled')) {
    const net = b.my_payout - b.my_total;
    result = b.status === 'cancelled' ? `<p class="mute">환불됨 (${b.my_total}점)</p>` : `<p class="${net >= 0 ? 'win' : 'lose'}">${net >= 0 ? '+' : ''}${net}점 (${b.my_total}점 걸고 ${b.my_payout}점 받음)</p>`;
  }
  const mgr = b.mine_created && (b.status === 'open' || b.status === 'closed') ? `<div class="betrow">
    ${open ? `<button onclick="act(${b.id},'close')">지금 마감</button>` : ''}<button onclick="if(confirm('취소하고 전부 환불할까요?'))act(${b.id},'cancel')">취소(환불)</button></div>` : '';
  return `<div class="card"><h2>${esc(b.title)}</h2><div class="mute">${esc(b.creator)} 개설 · ${statusText(b)} · 총 ${b.total}점</div>${opts}${result}${mgr}</div>`;
}
const wager = guard(async (optionId) => {
  const amount = Number($('#a' + optionId).value);
  await api('POST', '/api/wager', { option_id: optionId, amount });
  toast('걸었어요! 🎲'); await refresh();
});
const act = guard(async (bet_id, action, option_id) => {
  if (action === 'resolve' && !confirm('정답을 확정하면 되돌릴 수 없어요. 맞나요?')) return;
  await api('POST', '/api/bets/action', { bet_id, action, option_id });
  await refresh();
});
const aid = guard(async () => { await api('POST', '/api/aid'); toast('+100점!'); await refresh(); });

function newView() {
  return `<div class="card"><h2>내기 열기</h2>
  <input id="t" placeholder="예) 오늘 점심 메뉴는?" maxlength="80">
  <div id="os"><input class="o" placeholder="선택지 1"><input class="o" placeholder="선택지 2"></div>
  <button onclick="addOpt()">+ 선택지 추가</button>
  <input id="m" type="number" min="0" placeholder="몇 분 뒤 마감? (비우면 직접 마감)">
  <p class="mute">내기를 연 사람이 마감 후 정답을 확정해요. 공정하게 부탁해요 🤝</p>
  <button class="pri" onclick="create()">열기</button></div>`;
}
function addOpt() { if (document.querySelectorAll('.o').length < 6) $('#os').insertAdjacentHTML('beforeend', `<input class="o" placeholder="선택지 ${document.querySelectorAll('.o').length + 1}">`); }
const create = guard(async () => {
  await api('POST', '/api/bets', { title: $('#t').value, options: [...document.querySelectorAll('.o')].map((i) => i.value), closes_in_minutes: $('#m').value });
  tab = 'bets'; toast('내기가 열렸어요!'); await refresh();
});
function rankView() {
  return `<div class="card"><h2>랭킹</h2><table><tr><th>#</th><th>이름</th><th>승</th><th>패</th><th>점수</th></tr>${ranking.map((r, i) =>
    `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.wins}</td><td>${r.losses}</td><td><b>${r.points.toLocaleString()}</b></td></tr>`).join('')}</table></div>`;
}

refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
