<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--card:#0e0e16;--ink:#f3f1ff;--mute:#8d8aa8;--line:#25233a;--pri:#a855f7;--pink:#ff2d95;--cyan:#22d3ee;--win:#34f5a0;--lose:#ff4d6d;--dog:#ffb800}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font:15px/1.5 'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
 background-image:radial-gradient(600px 300px at 90% -5%,rgba(255,45,149,.28),transparent),radial-gradient(500px 300px at 5% 5%,rgba(34,211,238,.18),transparent);background-attachment:fixed}
main{max-width:860px;margin:0 auto;padding:16px}
h1{margin:6px 0 12px;font-size:22px;background:linear-gradient(90deg,var(--pink),var(--dog));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:17px;margin:0 0 8px}.mute{color:var(--mute);font-size:13px}
.card{background:linear-gradient(160deg,#14141f,var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0;box-shadow:0 8px 30px rgba(255,45,149,.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#07070c;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:22px;color:var(--cyan);text-shadow:0 0 10px rgba(34,211,238,.6)}
input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:7px 10px;background:#07070c;color:var(--ink);outline:none}
input{width:110px}button{cursor:pointer}button:hover{filter:brightness(1.3)}
button.pri{background:linear-gradient(90deg,var(--pri),var(--pink));border:0;font-weight:700}
button.danger{border-color:var(--lose);color:var(--lose)}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.acts{display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:#26243a;color:var(--cyan)}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--pri),var(--pink));font-weight:700;padding:10px 18px;border-radius:12px;z-index:9}
.opts button{margin:2px}
.set{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.set input[type=number]{width:120px}.sw{display:flex;gap:6px;align-items:center}.sw input{width:auto}
.item2{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}

/* 글꼴: 본문은 Noto Sans KR, 로고·제목·점수는 Black Han Sans (구글 폰트가 안 불러와져도 기본 글꼴로 보임) */
:root{--display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.3px}
h2 .mute{font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:400;letter-spacing:0}
</style>
</head>
<body>
<main id="app"><p class="mute">불러오는 중…</p></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 키는 주소의 # 뒤에 있어서 서버 로그에 남지 않아요. 한 번 읽으면 주소창에서 지워요.
let key = location.hash.slice(1) || sessionStorage.getItem('adminKey') || '';
if (key) { sessionStorage.setItem('adminKey', key); history.replaceState(null, '', location.pathname); }
let data = null;

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '오류');
  return j;
}
function toast(m) { const d = document.createElement('div'); d.className = 'msg'; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 2400); }
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };
const load = async () => { try { data = await api('GET', '/api/admin/overview'); render(); } catch (e) { $('#app').innerHTML = `<h1>🔒 관리자</h1><div class="card">${esc(e.message)}<br><span class="mute">서버를 켤 때 터미널에 나온 관리자 링크로 들어와 주세요.</span></div>`; } };

const userAct = guard(async (user_id, action, value) => {
  if (action === 'delete' && !confirm('이 유저를 삭제할까요?')) return;
  await api('POST', '/api/admin/user', { user_id, action, value }); toast('완료'); await load();
});
const askPoints = (id, action) => { const v = prompt(action === 'set_points' ? '새 점수?' : '더할 점수? (빼려면 -100)'); if (v !== null && v !== '') userAct(id, action, Number(v)); };
const askName = (id) => { const v = prompt('새 닉네임?'); if (v) userAct(id, 'rename', v); };
const askPin = (id) => { const v = prompt('새 PIN 4자리?'); if (v) userAct(id, 'reset_pin', v); };
const betAct = guard(async (bet_id, action, option_id) => {
  const msg = { delete: '도박을 삭제할까요? (진행 중이면 환불)', cancel: '취소하고 전액 환불할까요?', resolve: '이 선택지를 정답으로 확정할까요?' }[action];
  if (msg && !confirm(msg)) return;
  await api('POST', '/api/admin/bet', { bet_id, action, option_id }); toast('완료'); await load();
});
const delMsg = guard(async (id) => { await api('POST', '/api/admin/chat', { id }); await load(); });
const saveSettings = guard(async () => {
  const values = {};
  for (const sp of data.settings) {
    const el = document.getElementById('st_' + sp.key);
    if (sp.type === 'bool') values[sp.key] = el.checked;
    else { const n = Number(el.value); if (el.value.trim() === '' || !Number.isInteger(n)) throw new Error(`${sp.label}: 정수를 넣어주세요.`); values[sp.key] = n; }
  }
  await api('POST', '/api/admin/settings', { values }); toast('⚙️ 저장했어요. 바로 적용돼요'); await load();
});
const resetSetting = guard(async (key) => { await api('POST', '/api/admin/settings', { reset: [key] }); toast('기본값으로 되돌렸어요'); await load(); });
const resetAllSettings = guard(async () => {
  if (!confirm('모든 설정을 기본값으로 되돌릴까요?')) return;
  await api('POST', '/api/admin/settings', { reset: data.settings.map((x) => x.key) }); toast('모두 기본값으로 되돌렸어요'); await load();
});
const closeRoom = guard(async (kind, id) => {
  if (!confirm('이 방을 닫을까요? 참가자 모두에게 판돈이 환불돼요.')) return;
  await api('POST', '/api/admin/room', { kind, room_id: id }); toast('방을 닫고 환불했어요'); await load();
});
const delGroup = guard(async (i) => {
  const g = data.groups[i];
  const t = prompt(`⚠️ PIN 방 "${g.label}"(${g.members.join(', ')})을 통째로 지워요.\n그 방의 계정·점수·도박·채팅·게임 기록이 전부 사라지고 되돌릴 수 없어요.\n\n정말 지우려면 "삭제"라고 입력하세요.`);
  if (t !== '삭제') return;
  const r = await api('POST', '/api/admin/group', { grp: g.id }); toast(`방을 지웠어요 (계정 ${r.deleted_users}개)`); await load();
});
const gift = guard(async () => {
  const v = Number($('#gift').value);
  if (!confirm(`모든 유저에게 ${v}점을 줄까요?`)) return;
  await api('POST', '/api/admin/gift', { amount: v }); toast('🎁 지급 완료'); await load();
});

function render() {
  const st = data.stats;
  const S = { open: '진행', closed: '마감', resolved: '확정', cancelled: '취소' };
  $('#app').innerHTML = `<h1>🛠 관리자 콘솔</h1>
  <div class="stats">
    <div class="stat">유저<b>${st.users}</b></div><div class="stat">유통 포인트<b>${st.points.toLocaleString()}</b></div>
    <div class="stat">총 베팅 수<b>${st.wagers}</b></div><div class="stat">총 베팅액<b>${st.wagered.toLocaleString()}</b></div>
    <div class="stat">🍀 럭키 당첨<b>${st.lucky}</b></div></div>
  <div class="card"><h2>⚙️ 설정 <span class="mute">(저장하면 바로 적용돼요)</span></h2>
    ${data.settings.map((sp) => `<div class="set"><div><b>${esc(sp.label)}</b><div class="mute">${esc(sp.hint || '')} · 기본값 ${sp.type === 'bool' ? (sp.default ? '켜짐' : '꺼짐') : sp.default}</div></div>
      <div class="acts">${sp.type === 'bool' ? `<label class="sw"><input id="st_${sp.key}" type="checkbox" ${sp.value ? 'checked' : ''}> ${'켜기'}</label>` : `<input id="st_${sp.key}" type="number" min="${sp.min}" max="${sp.max}" value="${sp.value}">`}
      ${sp.value !== sp.default ? `<button onclick="resetSetting('${sp.key}')" title="기본값으로">↺</button>` : ''}</div></div>`).join('')}
    <div class="acts" style="margin-top:10px"><button class="pri" onclick="saveSettings()">저장</button><button onclick="resetAllSettings()">전부 기본값으로</button></div></div>
  <div class="card"><h2>🚪 PIN 방 <span class="mute">(PIN이 같은 사람들끼리의 방)</span></h2>${data.groups.map((g, i) => `<div class="item2"><div><span class="tag">방 ${esc(g.label)}</span> <b>${g.count}명</b> <span class="mute">· 점수 합 ${g.points.toLocaleString()} · 도박 ${g.bets}개 · 열린 게임 방 ${g.rooms}개</span>
      <div class="mute">${g.members.map(esc).join(', ')}</div></div><button class="danger" onclick="delGroup(${i})">방 삭제</button></div>`).join('') || '<p class="mute">없음</p>'}</div>
  <div class="card"><h2>🎮 열려 있는 게임 방 <span class="mute">(참가자를 기다리는 중 · 낸 패/숫자는 안 보여요)</span></h2>${data.rooms.map((r) => `<div class="item2"><div><span class="tag">${{ rps: '✊ 가위바위보', lun: '🤫 최저 유일 숫자', lad: '🪜 사다리' }[r.kind]}</span> <b>${esc(r.host)}</b> <span class="mute">· 판돈 ${r.stake}점 · ${r.players.length}/${r.cap}명 · 방 ${esc(r.grp || '없음')} · ${new Date(r.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
      <div class="mute">${r.players.map(esc).join(', ')}</div></div><button class="danger" onclick="closeRoom('${r.kind}',${r.id})">닫기(환불)</button></div>`).join('') || '<p class="mute">열려 있는 게임 방이 없어요.</p>'}</div>
  <div class="card"><h2>🎁 전체 지급</h2><input id="gift" type="number" placeholder="점수"> <button class="pri" onclick="gift()">모두에게 주기</button></div>
  <div class="card"><h2>유저</h2><table>${data.users.map((u) => `<tr><td><b>${esc(u.name)}</b> ${u.grp ? `<span class="tag" title="같은 PIN 방 번호">방 ${esc(u.grp)}</span>` : '<span class="tag">방 없음</span>'}</td><td>${u.points.toLocaleString()}점</td><td><div class="acts">
    <button onclick="askPoints(${u.id},'add_points')">± 더하기</button><button onclick="askPoints(${u.id},'set_points')">= 설정</button>
    <button onclick="askName(${u.id})">닉네임</button><button onclick="askPin(${u.id})">PIN 초기화</button><button class="danger" onclick="userAct(${u.id},'delete')">삭제</button></div></td></tr>`).join('')}</table></div>
  <div class="card"><h2>💬 최근 채팅</h2>${data.messages.map((m) => `<div class="mute"><b style="color:var(--cyan)">${esc(m.name)}</b>${m.bet_title ? ` <span class="tag">${esc(m.bet_title)}</span>` : ''}: ${esc(m.text)} <button class="danger" style="padding:0 6px" onclick="delMsg(${m.id})">삭제</button></div>`).join('') || '<p class="mute">없음</p>'}</div>
  <div class="card"><h2>도박</h2>${data.bets.map((b) => `<div style="border-bottom:1px solid var(--line);padding:8px 0">
    <b>${esc(b.title)}</b> <span class="tag">${S[b.status]}</span> <span class="mute">by ${esc(b.creator)} · 총 ${b.total}점</span>
    <div class="opts mute">${b.options.map((o) => `${b.winner === o.id ? '🏆' : ''}${esc(o.label)} (${o.pool}점/${o.bettors}명) ${b.status === 'open' || b.status === 'closed' ? `<button onclick="betAct(${b.id},'resolve',${o.id})">정답</button>` : ''}`).join(' · ')}</div>
    <div class="acts" style="margin-top:4px">${b.status === 'open' ? `<button onclick="betAct(${b.id},'close')">마감</button>` : ''}${b.status === 'open' || b.status === 'closed' ? `<button onclick="betAct(${b.id},'cancel')">취소(환불)</button>` : ''}<button class="danger" onclick="betAct(${b.id},'delete')">삭제</button></div></div>`).join('') || '<p class="mute">도박이 없어요.</p>'}</div>`;
}
load(); setInterval(() => { if (document.activeElement?.tagName !== 'INPUT') load(); }, 8000);
</script>
</body>
</html>
