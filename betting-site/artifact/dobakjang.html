main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:20px;background:linear-gradient(90deg,var(--cyan),var(--pri),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 8px rgba(168,85,247,.6))}
.pts{font-weight:800;color:var(--dog);text-shadow:0 0 10px rgba(255,184,0,.7)}
.card{position:relative;background:linear-gradient(160deg,#14141f,var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0;box-shadow:0 0 0 1px rgba(168,85,247,.08),0 8px 30px rgba(168,85,247,.12);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(168,85,247,.5),0 10px 36px rgba(255,45,149,.2)}
h2{font-size:18px;margin:0 0 4px}.mute{color:var(--mute);font-size:13px}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:10px 12px;background:#07070c;color:var(--ink);outline:none}
input{width:100%;margin:4px 0}input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(168,85,247,.25)}
button{cursor:pointer;transition:transform .1s,filter .15s}button:hover:not(:disabled){filter:brightness(1.25)}button:active:not(:disabled){transform:scale(.96)}
button.pri{background:linear-gradient(90deg,var(--pri),var(--pink));border:0;color:#fff;font-weight:700;box-shadow:0 0 16px rgba(255,45,149,.45)}
button:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;font-weight:600}
.tabs .on{background:linear-gradient(90deg,var(--cyan),var(--pri));color:#000;border:0;box-shadow:0 0 16px rgba(34,211,238,.5)}
.opt{margin:12px 0;padding:8px 10px;border-radius:12px;border:1px solid transparent}
.bar{height:10px;background:#1a1a28;border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pri));box-shadow:0 0 12px var(--pri);transition:width .5s}
.opt.dog{border-color:rgba(255,184,0,.45);background:rgba(255,184,0,.06);animation:glow 2s infinite}
.opt.dog .bar i{background:linear-gradient(90deg,var(--dog),var(--pink));box-shadow:0 0 12px var(--dog)}
.opt.won{border-color:var(--win);background:rgba(52,245,160,.07);box-shadow:0 0 18px rgba(52,245,160,.3)}
.opt.won .bar i{background:linear-gradient(90deg,var(--win),var(--cyan));box-shadow:0 0 12px var(--win)}
@keyframes glow{50%{box-shadow:0 0 16px rgba(255,184,0,.35)}}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:linear-gradient(90deg,var(--dog),var(--pink));color:#000;margin-left:6px;vertical-align:middle}
.tag.s{background:#26243a;color:var(--cyan)}
.win{color:var(--win);font-weight:800;text-shadow:0 0 10px rgba(52,245,160,.6)}.lose{color:var(--lose);font-weight:800}
.lucky{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:99px;font-weight:800;color:#000;background:linear-gradient(90deg,#fff176,#ffb800,#ff8a3d);box-shadow:0 0 14px rgba(255,184,0,.8)}
.betrow{display:flex;gap:6px;margin-top:6px}.betrow input{margin:0}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--pri),var(--pink));color:#fff;font-weight:700;padding:10px 18px;border-radius:12px;z-index:9;max-width:90%;box-shadow:0 0 24px rgba(255,45,149,.6)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}td:nth-child(n+3),th:nth-child(n+3){text-align:right}

<script>
/**
 * 아티팩트용 저장소 엔진.
 * 구글 앱스 스크립트 버전의 규칙 코드(Code.gs)를 그대로 쓰고, 시트 대신 아티팩트의 공유 DB(claude.use('db'))에 저장합니다.
 *
 * - 읽기: 실시간 구독으로 유지되는 메모리 사본에서 바로 (빠름)
 * - 쓰기(POST): DB 의 짧은 임대(acquire)로 한 번에 한 사람씩 → 최신 상태로 맞춘 뒤 규칙 실행 → 바뀐 문서만 저장
 * - 채팅은 새 문서를 추가할 뿐이라 임대 없이 바로 저장
 */
(function (root) {
  'use strict';
  var PERSIST = ['users', 'bets', 'options', 'wagers', 'items', 'rooms', 'rps', 'lun', 'lunp', 'lad', 'ladp', 'bj', 'slots', 'drops', 'dropc', 'begs', 'begg'];
  var LOCAL = ['sessions'];                       // 이 브라우저에만 있는 표 (로그인 표시)
  var MESSAGES = 'messages';                      // 채팅: 최근 것만 구독, 임대 없이 추가
  var MSG_LIMIT = 400;
  var LEASE_MS = 1200;

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function byId(a, b) { return a.id - b.id; }

  function Engine(opts) {
    var self = this;
    this.db = opts.db;
    this.uid = opts.uid;                          // 이 사람의 아이디 (user.id())
    this.isOwner = !!opts.isOwner;
    this.makeGS = opts.makeGS;                    // (ctx) => 규칙 코드 모듈
    this.tables = {};                             // name -> { map: Map(key -> row), arr: [row...] }
    this.dirty = new Map();                       // 'table/key' -> { table, key, data|null }
    this.pendingKeys = new Set();                 // 저장 중인 문서는 구독이 덮어쓰지 않게
    this.listeners = [];
    this.unsubs = [];
    this.settingsJson = '';
    this.settingsWrite = null;
    this.leaseHeld = false;
    this.needLock = false;
    this.rev = 0;
    this.lastFull = 0;
    this.ready = false;
    this.queue = Promise.resolve();               // 이 브라우저 안에서도 쓰기는 한 줄로
    PERSIST.concat(LOCAL, [MESSAGES]).forEach(function (n) { self.tables[n] = { map: new Map(), arr: [] }; });
    this.msgSeq = 0;

    var ctx = {
      rows: function (name) { return self._rows(name); },
      nextId: function (name) { return self._nextId(name); },
      add: function (name, row) { self._add(name, row); },
      touch: function (name, row) { self._touch(name, row); },
      del: function (name, row) { self._del(name, row); },
      isOwner: function () { return self.isOwner; },
      lockOk: function () { if (self.leaseHeld) return true; self.needLock = true; return false; },
      getProp: function (k) { return k === 'SETTINGS' ? self.settingsJson : undefined; },
      setProp: function (k, v) { if (k === 'SETTINGS') { self.settingsJson = v; self.settingsWrite = v; } },
    };
    this.ctx = ctx;
    this.gs = this.makeGS(ctx);
  }

  /* ---------- 메모리 사본 ---------- */
  Engine.prototype._rows = function (name) { var t = this.tables[name]; if (!t) throw new Error('없는 표: ' + name); return t.arr; };
  Engine.prototype._keyOf = function (name, row) {
    if (name === 'items') return row.user_id + '_' + row.item_id;
    return String(row.id);
  };
  Engine.prototype._nextId = function (name) {
    if (name === MESSAGES) return Date.now() * 1000 + (this.msgSeq = (this.msgSeq + 1) % 1000);   // 임대 없이 쓰므로 겹치지 않게 시간 기반
    var m = 0; this.tables[name].arr.forEach(function (r) { if (r.id > m) m = r.id; });
    return m + 1;
  };
  Engine.prototype._sortedInsert = function (name, row) {
    var t = this.tables[name]; t.arr.push(row);
    if (name !== 'items' && t.arr.length > 1 && t.arr[t.arr.length - 2].id > row.id) t.arr.sort(byId);
  };
  Engine.prototype._add = function (name, row) {

/** 파리뮤추얼 + 역배 보너스 + 럭키 보너스 (Node 버전과 동일 규칙) */
function settle(bet, winnerId) {
  var wagers = tbl('wagers').where(function (w) { return w.bet_id === bet.id; });
  var total = wagers.reduce(function (s, w) { return s + w.amount; }, 0);
  var winners = wagers.filter(function (w) { return w.option_id === winnerId; });
  var winPool = winners.reduce(function (s, w) { return s + w.amount; }, 0);
  if (winPool === 0 || winPool === total) { wagers.forEach(refund); return { refunded: true, total: total, underdog: false }; }
  var underdog = winPool / total < CFG.UNDERDOG_SHARE;
  var pot = total + (underdog ? Math.floor(total * CFG.UNDERDOG_BONUS) : 0), paid = 0;
  winners.forEach(function (w, i) {
    var base = i === winners.length - 1 && !underdog ? total - paid : Math.floor(pot * w.amount / winPool);
    paid += base;
    var lucky = Math.random() < CFG.LUCKY_CHANCE;
    var pay = base + (lucky ? Math.max(1, Math.floor(base * CFG.LUCKY_BONUS)) : 0);
    w.payout = pay; w.lucky = lucky ? 1 : 0; tbl('wagers').save(w); addPoints(w.user_id, pay);
  });
  wagers.forEach(function (w) { if (w.option_id !== winnerId) { w.payout = 0; tbl('wagers').save(w); } });
  return { refunded: false, total: total, underdog: underdog };
}

function betAction(bet, body) {
  if (bet.status === 'resolved' || bet.status === 'cancelled') fail(400, '이미 끝난 도박입니다.');
  if (body.action === 'close') { bet.status = 'closed'; tbl('bets').save(bet); return { ok: true }; }
  if (body.action === 'cancel') {
    tbl('wagers').where(function (w) { return w.bet_id === bet.id; }).forEach(refund);
    bet.status = 'cancelled'; tbl('bets').save(bet); return { ok: true };
  }
  if (body.action === 'resolve') {
    var oid = Number(body.option_id);
    var opt = tbl('options').find(function (o) { return o.id === oid && o.bet_id === bet.id; }) || fail(400, '정답 선택지를 골라주십시오.');
    var r = settle(bet, opt.id);
    bet.status = r.refunded ? 'cancelled' : 'resolved'; bet.winner = r.refunded ? '' : opt.id; tbl('bets').save(bet);
    return { ok: true, refunded: r.refunded, total: r.total, underdog: r.underdog };
  }
  fail(400, '알 수 없는 동작입니다.');
}

/* ================= 🤫 최저 유일 숫자 / 🪜 사다리타기 (여러 명이 방에 모여서 하는 게임) ================= */

var DUP_MS = 5000;   // 같은 사람이 같은 조건의 방/도박을 이 시간 안에 또 만들면 연타로 보고 거절

/** 12시간 동안 다 안 모인 방은 닫고 모두에게 환불 */
function roomsSweep() {
  [['lun', 'lunp'], ['lad', 'ladp']].forEach(function (pair) {
    var old = function () { return tbl(pair[0]).where(function (r) { return r.status === 'waiting' && r.created_at < now() - RPS.EXPIRE_MS; }); };
    if (!old().length) return;
    withLock(function () {
      TBL[pair[0]] = null; TBL[pair[1]] = null; TBL.users = null;
      old().forEach(function (r) {
        tbl(pair[1]).where(function (p) { return p.room_id === r.id; }).forEach(function (p) { addPoints(p.user_id, r.stake); });
        r.status = 'cancelled'; tbl(pair[0]).save(r);

}
function lunPlayers(room) { return tbl('lunp').where(function (p) { return p.room_id === room.id; }); }
function lunResolve(room) {

  if (w < 0) ps.forEach(function (p) { addPoints(p.user_id, room.stake); });          // 전부 겹침 → 환불
  else addPoints(ps[w].user_id, room.stake * ps.length);                                // 승자가 판돈 전체
  room.status = 'done'; room.winner_id = w < 0 ? '' : ps[w].user_id; room.played_at = now(); tbl('lun').save(room);
}
/* ================= 💸 돈뿌리기 / 🙏 구걸하기 ================= */

  var oldB = function () { return tbl('begs').where(function (r) { return r.status === 'open' && r.created_at < now() - RPS.EXPIRE_MS; }); };

/* ================= 🃏 블랙잭 / 🎰 슬롯머신 (서버 딜러와 하는 혼자 게임) ================= */
function checkBet(raw, min, max) {

}
/** 오늘(한국 시간) 혼자 하는 게임(블랙잭+슬롯)에서 번 순이익과 한 판 수 */
function soloToday(uid) {
  var ds = GAMES.dayStart(now()), net = 0, plays = 0;
  tbl('slots').all().forEach(function (r) { if (r.user_id === uid && r.created_at >= ds) { net += r.payout - r.bet; plays++; } });
  tbl('bj').all().forEach(function (r) {
    if (r.user_id !== uid) return;
    if (r.created_at >= ds) plays++;
    if (r.status === 'done' && r.finished_at >= ds) { var st = JSON.parse(r.state); net += r.payout - st.bet * (st.doubled ? 2 : 1); }
  });
  return { net: net, plays: plays };
}

/** 새 판을 시작하기 전에: 오늘 한도에 닿았으면 막음 */

  }
  row.state = JSON.stringify(st); row.status = st.status; row.outcome = st.outcome || ''; row.payout = st.payout;
  row.finished_at = st.status === 'done' ? now() : '';
  tbl('bj').save(row);
  if (st.status === 'done') addPoints(row.user_id, st.payout);
}

/* ================= API 경로 ================= */
function removeUser(u) {   // 계정 삭제 (관리자 삭제·추방 공용). 진행 중인 도박/게임에 걸려 있으면 거부
  var active = {}; tbl('bets').all().forEach(function (b) { if (b.status === 'open' || b.status === 'closed') active[b.id] = 1; });
  if (tbl('wagers').find(function (w) { return w.user_id === u.id && active[w.bet_id]; })) fail(400, '진행 중인 도박에 건 돈이 있어서 처리할 수 없습니다. 그 도박이 끝난 뒤에 하십시오.');
  var waitingLun = {}, waitingLad = {};
  tbl('lun').all().forEach(function (r) { if (r.status === 'waiting') waitingLun[r.id] = 1; });
  tbl('lad').all().forEach(function (r) { if (r.status === 'waiting') waitingLad[r.id] = 1; });
  if (tbl('lunp').find(function (p) { return p.user_id === u.id && waitingLun[p.room_id]; }) || tbl('ladp').find(function (p) { return p.user_id === u.id && waitingLad[p.room_id]; }) || bjActive(u.id)) fail(400, '진행 중인 게임이 있어서 처리할 수 없습니다. 끝나거나 닫힌 뒤에 하십시오.');
  tbl('rps').where(function (r) { return r.host_id === u.id && r.status === 'waiting'; }).forEach(function (r) { r.status = 'cancelled'; tbl('rps').save(r); });
  tbl('sessions').removeWhere(function (s) { return s.user_id === u.id; });
  tbl('messages').removeWhere(function (m) { return m.user_id === u.id; });
  tbl('items').removeWhere(function (r) { return r.user_id === u.id; });
  tbl('users').remove(u);
  tbl('drops').where(function (r) { return r.host_id === u.id && r.status === 'open'; }).forEach(function (r) { r.status = 'cancelled'; tbl('drops').save(r); });
  tbl('begs').where(function (r) { return r.user_id === u.id && r.status === 'open'; }).forEach(function (r) { r.status = 'closed'; tbl('begs').save(r); });
}
var ROUTES = {
  'GET /api/state': function (body, u) { sweep(); var ok = u && !isPending(u); return { me: u ? meView(u) : null, bets: ok ? betsList(u) : [], ranking: ok ? rankingView(u) : [], rps: ok ? rpsView(u) : (u ? { rooms: [], recent: [] } : null) }; },
  'POST /api/kick': function (body, u) {   // 방장이 방 멤버를 추방: 계정 삭제 (다시 들어오는 건 막지 않음)

    if (t.id === u.id) fail(400, '자신은 추방할 수 없습니다.');

  },
  'POST /api/approve': function (body, u) {   // 방장이 가입 요청을 승인(칩 지급)하거나 거절(계정 삭제)
    needLogin(u);
    var t = userById(Number(body.user_id));
    if (!t || t.approved !== 0 || grpOf(t) !== grpOf(u) || ownerIdOf(grpOf(u)) !== u.id) fail(404, '대기 중인 가입 요청이 없습니다.');
    if (body.accept) { t.approved = 1; t.points = CFG.START_POINTS; tbl('users').save(t); }

      var keys = tbl('sessions').where(function (s) { return s.user_id === t.id; }).map(function (s) { return 's_' + s.token; });

      tbl('sessions').removeWhere(function (s) { return s.user_id === t.id; });

    }
    return { ok: true };
  },

  // (테스트/내부용) 방 코드를 안 주면 PIN을 방 코드로 씀. 방이 없으면 만들고 계정을 만듦
  'POST /api/signup': function (body) {
    var name = checkName(body.name), pin = String(body.pin === undefined || body.pin === null ? '' : body.pin);
    if (!PIN_RE.test(pin)) fail(400, 'PIN은 공백 없이 4~16자입니다.');   // 방을 만들기 전에 값부터 검사 (실패했는데 빈 방이 남지 않게)
    var grp = ensureRoom(String(body.room === undefined ? pin : body.room).trim());
    if (userInRoom(grp, name)) fail(409, '이 방에 이미 있는 닉네임입니다.');

  'POST /api/login': function (body) {

    var code = String(body.room === undefined ? pin : body.room).trim();
    throttle('login|' + code + '|' + name, 10);
    var u = userInRoom(groupKey(code), name);
    if (!u || hashPin(pin, u.salt) !== u.hash) fail(401, '방 코드, 닉네임, PIN을 확인해 주십시오.');
    CacheService.getScriptCache().remove('login|' + code + '|' + name);
    return { token: newSession(u.id) };
  },
  // 방 들어가기(mode:'join') / 방 만들기(mode:'create'). 들어갈 땐: 이 방에 닉네임이 있으면 로그인(PIN 확인), 없으면 (확인 후) 새 계정.
  'POST /api/enter': function (body) {

      checkName(name);
      if (!PIN_RE.test(pin)) fail(400, 'PIN은 공백 없이 4~16자입니다.');   // 방을 만들기 전에 값부터 검사
      ensureRoom(code);
      return { token: addAccount(grp, name, pin, devOf(body)), created_room: true };
    }
    if (!room) fail(404, '없는 방 코드입니다. 방을 새로 만들려면 "방 만들기"를 눌러주십시오.');
    var u = userInRoom(grp, name);
    if (u) {
      throttle('login|' + code + '|' + name, 10);
      if (hashPin(pin, u.salt) !== u.hash) fail(401, '이 방에 이미 있는 닉네임입니다. 내 계정이면 PIN이 다릅니다(다시 확인해 주십시오). 처음이라면 다른 닉네임을 써주십시오.');
      CacheService.getScriptCache().remove('login|' + code + '|' + name);
      if (devOf(body) && !u.dev) { u.dev = devOf(body); tbl('users').save(u); }   // 예전 계정도 처음 로그인한 기기에 묶음
      return { token: newSession(u.id) };
    }
    checkName(name);
    if (!PIN_RE.test(pin)) fail(400, 'PIN은 공백 없이 4~16자입니다.');
    checkDevice(grp, devOf(body));   // 확인 창을 띄우기 전에 알려 줌
    if (!body.create) return { new_user: true };
    return { token: addAccount(grp, name, pin, devOf(body)) };
  },
  'POST /api/nickname': function (body, u) {

  'POST /api/bets': function (body, u) {

    var mins = Number(body.closes_in_minutes), closes = mins > 0 ? now() + Math.min(mins, 60 * 24 * 30) * 6e4 : '';
    if (isDup('bets', function (r) { return r.creator_id === u.id && r.title === title; })) fail(409, '연타');

  'POST /api/wager': function (body, u) {

  // 채팅은 도박마다 따로: 목록에서 도박에 들어가서 그 안에서만 이야기합니다

  'GET /api/rps': function (body, u) { needLogin(u); return rpsView(u); },
  'POST /api/rps/create': function (body, u) {
    needLogin(u);

    if (RPS.HANDS.indexOf(hand) < 0) fail(400, '가위·바위·보 중에 골라주십시오.');

    if (isDup('rps', function (r) { return r.host_id === u.id && r.stake === stake && r.status === 'waiting'; })) fail(409, '연타');
    if (tbl('rps').where(function (r) { return r.host_id === u.id && r.status === 'waiting'; }).length >= RPS.MAX_OPEN) fail(400, '동시에 열 수 있는 방은 ' + RPS.MAX_OPEN + '개까지입니다.');
    u.points -= stake; tbl('users').save(u);   // 판돈은 방을 여는 순간 맡겨짐
    var r = tbl('rps').insert({ host_id: u.id, stake: stake, host_hand: hand, guest_id: '', guest_hand: '', status: 'waiting', result: '', created_at: now(), played_at: '' });
    return { ok: true, id: r.id };
  },
  'POST /api/rps/join': function (body, u) {
    needLogin(u);
    var hand = String(body.hand);
    if (RPS.HANDS.indexOf(hand) < 0) fail(400, '가위·바위·보 중에 골라주십시오.');
    var rid = Number(body.room_id);
    var r = tbl('rps').find(function (x) { return x.id === rid; }) || fail(404, '방이 없습니다.');
    if (!sameRoom(r.host_id, u)) fail(404, '방이 없습니다.');   // 다른 PIN 방의 가위바위보에는 못 들어옴
    if (r.status !== 'waiting') fail(400, '이미 끝났거나 닫힌 방입니다.');
    if (r.host_id === u.id) fail(400, '내가 만든 방에는 들어갈 수 없습니다.');
    if (u.points < r.stake) fail(400, '칩이 부족합니다.');
    var result = r.host_hand === hand ? 'draw' : RPS.BEATS[r.host_hand] === hand ? 'host' : 'guest';
    // 방장은 판돈을 이미 냈고, 도전자는 지금 낸다. 이긴 쪽이 2배, 비기면 각자 환불.
    if (result === 'draw') addPoints(r.host_id, r.stake);
    else if (result === 'host') { addPoints(r.host_id, r.stake * 2); u.points -= r.stake; tbl('users').save(u); }
    else { u.points += r.stake; tbl('users').save(u); }
    r.guest_id = u.id; r.guest_hand = hand; r.status = 'done'; r.result = result; r.played_at = now(); tbl('rps').save(r);

      outcome: result === 'draw' ? 'draw' : result === 'guest' ? 'win' : 'lose', net: result === 'draw' ? 0 : result === 'guest' ? r.stake : -r.stake };
  },
  'POST /api/rps/cancel': function (body, u) {

    r.status = 'cancelled'; tbl('rps').save(r);

  /* ---- 🤫 최저 유일 숫자 ---- */
  'GET /api/lun': function (body, u) { needLogin(u); return lunView(u); },

  'POST /api/lun/join': function (body, u) {

    addPoints(u.id, -r.stake);
    tbl('lunp').insert({ room_id: r.id, user_id: u.id, num: num, joined_at: now() });
    var full = ps.length + 1 >= r.cap;
    if (full) lunResolve(r);
    return { ok: true, id: r.id, resolved: full };
  },
  'POST /api/lun/start': function (body, u) {   // 방장이 모인 사람들(3명 이상)로 먼저 시작

  'POST /api/lun/cancel': function (body, u) {

  /* ---- 🪜 사다리타기 ---- */
  /* ---- 💸 돈뿌리기 / 🙏 구걸하기 ---- */

  'POST /api/drop/create': function (body, u) {

  'GET /api/ladder': function (body, u) { needLogin(u); return ladderView(u); },

    var full = ps.length + 1 >= r.slots;

/* ===== 저장소를 시트 대신 아티팩트 DB(엔진)로 바꾸는 부분 ===== */
Table = function (name) { this.name = name; this.cols = SHEETS[name]; this.sheet = { deleteRows: function () {} }; };
Table.prototype.all = function () { return ENG.rows(this.name); };
Table.prototype.find = function (fn) { return this.all().filter(fn)[0] || null; };
Table.prototype.where = function (fn) { return this.all().filter(fn); };
Table.prototype.insert = function (o) { if (this.cols[0] === 'id') o.id = ENG.nextId(this.name); ENG.add(this.name, o); return o; };
Table.prototype.save = function (o) { ENG.touch(this.name, o); };
Table.prototype.remove = function (o) { ENG.del(this.name, o); };
Table.prototype.removeWhere = function (fn) { var self = this; this.where(fn).slice().forEach(function (o) { self.remove(o); }); };
groupKey = function (code) { return 'g_' + String(code).toLowerCase(); };   // 방은 하나뿐이라 코드가 그대로 방 번호
hashPin = function (pin, salt) { return 'h:' + pin + ':' + salt; };   // 로그인은 계정 번호로 자동. PIN 은 형식만 맞춤
adminOnly = function () { if (!ENG.isOwner()) fail(403, '관리자만 사용할 수 있습니다. 아티팩트 소유자 계정으로 열어주십시오.'); };
CFG.APPROVAL = false;   // 접근은 공유(초대)로 관리하므로 가입 승인은 끔
__mem.SCHEMA_V = SCHEMA_V;
return { handle: handle, reset: function () { HOLDING = false; }, CFG: CFG, GAMES: GAMES, tbl: tbl, SHEETS: SHEETS, ROUTES: ROUTES };

};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { // 앱스 스크립트 화면에서는 저장소가 막힐 수 있어 안전하게 감쌈
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* 무시 */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* 무시 */ } },
};
let token = null, user = null, tab = 'bets', bets = [], ranking = [], busy = false;

async function api(method, url, body) {
  if (!ENGINE) throw new Error(ENG_ERR || '연결 중입니다. 잠시 뒤 다시 해주십시오.');
  const j = await ENGINE.call(token || '', method, url, body || {});
  if (j.error) { if (j.code === 401 && token) logout(); const e = new Error(j.error); e.code = j.code; throw e; }
  return j.data;
}
function toast(m) { if (m === '연타') return; const d = document.createElement('div'); d.className = 'msg'; d.textContent = m; document.body.append(d); setTimeout(() => d.remove(), 2600); }
// 처리 중에 같은 버튼을 또 눌러도 무시 (연타해도 방/도박이 여러 개 생기지 않게)
const DEV = (() => {   // 이 브라우저의 기기 번호 (한 기기에서 계정을 여러 개 못 만들게 서버에 같이 보냄)
  let d = ''; try { d = LS.get('dev') || ''; } catch { /* 무시 */ }
  if (!/^[A-Za-z0-9]{12,64}$/.test(d)) { d = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => b.toString(16).padStart(2, '0')).join(''); try { LS.set('dev', d); } catch { /* 무시 */ } }
  return d;
})();
const guard = (fn) => { let busy = false; return async (...a) => { if (busy) return; busy = true; try { await fn(...a); } catch (e) { toast(e.message); } finally { busy = false; } }; };
function logout() { token = null; user = null; chatMsgs = []; lastChatId = 0; gamesInit = false; watch = { lun: false, lad: false }; LS.del('token'); render(); }

}

async function refreshBody() {
  if (!token) return;                     // 로그인 화면은 다시 그리지 않음 (입력 중 지워짐 방지)
  try {
    ({ me: user, bets, ranking, rps } = await api('GET', '/api/state'));

    const np = (user && user.pending_list ? user.pending_list.length : 0);
    if (np > lastPending) toast('가입 승인 요청이 있습니다.');
    lastPending = np;
    await gamesTick();
    const seen = JSON.parse(LS.get('luckySeen') || '[]');
    const fresh = bets.filter((b) => b.my_lucky && !seen.includes(b.id));
    if (fresh.length) { LS.set('luckySeen', JSON.stringify(seen.concat(fresh.map((b) => b.id)))); toast('🍀 럭키 보너스 당첨!!'); }
    if (!$('#app').innerHTML || (tab !== 'new' && tab !== 'chat' && !(document.activeElement && document.activeElement.tagName === 'INPUT'))) render();
    else renderHeader();

}

async function fetchLun() { lun = await api('GET', '/api/lun'); watch.lun = lun.rooms.some((r) => r.joined); notifyMulti('lun', lun.recent, '🤫 최저 유일 숫자'); }
async function fetchLad() { lad = await api('GET', '/api/ladder'); watch.lad = lad.rooms.some((r) => r.joined); notifyMulti('lad', lad.recent, '🪜 사다리타기'); }
function notifyMulti(kind, recent, label) {   // 내가 낀 방이 내가 없는 사이 결판났으면 알려줌
  const key = 'seen_' + kind, mine = recent.filter((r) => r.mine), raw = LS.get(key);
  if (raw === null) { LS.set(key, JSON.stringify(mine.map((r) => r.id))); return; }
  const seen = JSON.parse(raw), fresh = mine.filter((r) => !seen.includes(r.id));
  if (!fresh.length) return;
  LS.set(key, JSON.stringify(seen.concat(fresh.map((r) => r.id))));
  const f = fresh[0];
  toast(`${label} 결과: ${f.net > 0 ? '이겼습니다! ' : f.net < 0 ? '졌습니다 ' : ''}${f.net === 0 ? '승자 없음, 판돈은 그대로' : netText(f.net)}`);
}
function markSeen(kind, id) { try { const k = 'seen_' + kind, a = JSON.parse(LS.get(k) || '[]'); if (!a.includes(id)) LS.set(k, JSON.stringify(a.concat(id))); } catch { /* 무시 */ } }
async function loadGame() {
  if (!token) return;
  const view = curView();
  try {
    if (view === 'lun') await fetchLun();
    else if (view === 'lad') await fetchLad();
    else if (view === 'drop' || view === 'beg') { const d = await api('GET', '/api/gifts'); if (curView() !== view) return; gift = d; }
    else if (view === 'all') await Promise.all([fetchLun(), fetchLad()]);
    else if (view === 'bj') { const d = await api('GET', '/api/blackjack'); if (curView() !== 'bj') return; bj = d; }
    else if (view === 'slots') { const d = await api('GET', '/api/slots'); if (curView() !== 'slots') return; slotData = d; }
    else return;
  } catch (e) { return; }
  if (curView() === view && !(document.activeElement && document.activeElement.tagName === 'INPUT') && !slotUi.busy) render();
}
async function gamesTick() {
  const view = curView();
  if (!gamesInit) { gamesInit = true; try { await Promise.all([fetchLun(), fetchLad()]); } catch (e) { /* 무시 */ } }
  else {
    if (watch.lun && view !== 'lun' && view !== 'all') { try { await fetchLun(); } catch (e) { /* 무시 */ } }
    if (watch.lad && view !== 'lad' && view !== 'all') { try { await fetchLad(); } catch (e) { /* 무시 */ } }
  }
  await loadGame();
}

/* ---- 🤫 최저 유일 숫자 ---- */

/* ---- 🪜 사다리타기 ---- */
const LAD_RULES = `<details %OPEN% class="rules"><summary><b>🪜 사다리타기란 무엇입니까?</b></summary>
  <p>방장이 <b>인원(2~6명)과 판돈</b>을 정하고 방을 열습니다. 사람들이 <b>자리(번호)를 골라 앉습니다.</b> 모두 같은 판돈을 냅니다.</p>
  <p><b>자리가 다 차는 순간</b> 사다리가 만들어지고, 아래쪽에서 <b>딱 한 칸이 당첨</b>으로 정해집니다. 그 칸에 도착한 사람이 <b>판돈 전부</b>를 가져갑니다.</p>
  <p class="mute">사다리는 자리가 다 찬 뒤에야 만들어지니까 미리 알고 고를 수는 없습니다. 어느 자리든 당첨 확률은 똑같이 1/인원수입니다.</p></details>`;
const LCOL = ['#22d3ee', '#ff2d95', '#ffb800', '#34f5a0', '#a855f7', '#ff6b3d'];
function ladderSvg(r) {
  const N = r.slots, R = r.rungs.length, W = Math.max(240, N * 62), H = 250, top = 38, bot = H - 40, gap = (bot - top) / R;
  const x = (i) => 28 + i * (W - 56) / Math.max(1, N - 1), yy = (ri) => top + (ri + 0.5) * gap;
  let g = '';
  for (let i = 0; i < N; i++) g += `<line class="lv" x1="${x(i)}" y1="${top}" x2="${x(i)}" y2="${bot}"/>`;
  r.rungs.forEach((row, ri) => row.forEach((i) => { g += `<line class="lr" x1="${x(i)}" y1="${yy(ri)}" x2="${x(i + 1)}" y2="${yy(ri)}"/>`; }));
  r.seats.forEach((s) => {
    const win = s.end === r.win_end, pts = [[x(s.path[0]), top]];
    for (let ri = 0; ri < R; ri++) { pts.push([x(s.path[ri]), yy(ri)]); pts.push([x(s.path[ri + 1]), yy(ri)]); }
    pts.push([x(s.path[R]), bot]);
    g += `<polyline fill="none" stroke="${LCOL[s.slot % 6]}" stroke-width="${win ? 5 : 3}" stroke-opacity="${win ? 1 : .55}" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((p) => p.join(',')).join(' ')}"/>`;
    g += `<text x="${x(s.slot)}" y="${top - 14}" text-anchor="middle" font-size="11" fill="${LCOL[s.slot % 6]}">${esc(s.name.length > 4 ? s.name.slice(0, 4) + '…' : s.name)}</text>`;
  });
  for (let i = 0; i < N; i++) g += `<text x="${x(i)}" y="${bot + 22}" text-anchor="middle" font-size="${i === r.win_end ? 18 : 12}" fill="${i === r.win_end ? '#ffb800' : '#8d8aa8'}">${i === r.win_end ? '🏆' : '꽝'}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W + 40}px;display:block;margin:6px auto">${g}</svg>`;
}
function ladRooms() {
  return lad.rooms.map((r) => {
    const taken = r.seats.filter(Boolean).length;
    const seats = `<div class="seats">${r.seats.map((s, i) => s ? `<span class="seat on ${s.mine ? 'mine' : ''}">${i + 1}번 ${esc(s.name)}</span>`
      : r.joined ? `<span class="seat">${i + 1}번 빈자리</span>` : `<button class="seat free" onclick="joinLad(${r.id},${i})">${i + 1}번 앉기</button>`).join('')}</div>`;
    return `<div class="room ${r.mine ? 'mine' : ''}"><div class="row"><span>${nm(r.host)} ${r.joined ? '<span class="tag s">참가 중</span>' : ''}</span><b class="pts">${r.stake.toLocaleString()}🪙</b></div>
      <div class="mute">${taken}/${r.slots}명 · 자리가 다 차면 바로 사다리를 탑니다 ${r.joined ? '' : '· 앉으면 ' + r.stake + '🪙이 빠져나갑니다'}</div>${seats}

}

/* ---- 혼자 하는 게임 하루 한도 안내 ---- */
function soloBar(l) {
  if (!l || (!(l.net_cap > 0) && !(l.plays_cap > 0))) return '';
  const parts = [];
  if (l.net_cap > 0) parts.push(`오늘 번 🪙 <b class="${netCls(l.net_today)}">${netText(l.net_today)}</b> / 하루 최대 +${l.net_cap}🪙 <span class="mute">(남은 한도 ${l.remaining}🪙)</span>`);
  if (l.plays_cap > 0) parts.push(`오늘 한 판 ${l.plays_today} / ${l.plays_cap}번`);
  const warn = l.blocked === 'net' ? '오늘 번 🪙이 한도에 도달했습니다! 내일 한국 시간 자정 이후에 다시 할 수 있습니다.' : l.blocked === 'plays' ? '오늘 할 수 있는 횟수를 다 썼습니다. 내일 다시 합니다.' : '';
  return `<div class="limit">${parts.join('<br>')}${warn ? `<div class="lose" style="margin-top:4px">${warn}</div>` : ''}<div class="mute">블랙잭과 슬롯을 합쳐서 계산하고, 매일 한국 시간 자정에 초기화됩니다.</div></div>`;
}

    <li><b>🃏 블랙잭</b>: 처음 받은 2장이 <b>A + 10 카드(10·J·Q·K) = 21</b>이면 <b>건 돈의 2.5배</b>를 받습니다 (순이익 +1.5배, 3:2). 딜러도 블랙잭이면 무승부, 딜러만 블랙잭이면 바로 패배입니다.</li></ul>
  <p class="mute"><b>예시</b> 100🪙을 걸었는데 나는 10 + 7 = 17, 딜러는 9(공개) + ?. 스탠드하니 딜러가 9 + 6 = 15 → 한 장 더 받아 K → 25로 버스트! → <b>승리, 200🪙 돌려받습니다 (+100)</b>.</p>
  <p class="mute"><b>팁</b> 내 합이 11 이하면 히트해도 터지지 않습니다. 합이 17 이상이면 보통 스탠드. 딜러의 공개 카드가 2~6이면 딜러가 터지기 쉬우니 12~16에서도 멈추는 게 유리할 때가 많습니다.</p>
  <p class="mute">※ 카드 나누기(스플릿)와 보험은 없습니다. 판마다 카드 한 벌(52장)을 새로 섞습니다. 서버가 카드를 정하고, 딜러의 뒤집힌 카드는 결과가 나오기 전까지 내 화면으로 보내지지도 않습니다.</p></details>`;
const cardHtml = (c) => (c ? `<span class="pc ${c.red ? 'red' : ''}">${c.rank}${c.suit}</span>` : '<span class="pc back">?</span>');
const BJ_MSG = { blackjack: ['🃏 블랙잭! 3:2로 받습니다', 'win'], win: ['이겼습니다!', 'win'], lose: ['졌습니다', 'lose'], push: ['무승부 · 건 돈을 돌려받습니다', 'mute'], bust: ['버스트! 21을 넘었습니다', 'lose'] };
const OUT_TXT = { blackjack: '블랙잭', win: '승', lose: '패', push: '무', bust: '버스트' };
function bjTable() {
  const g = bj.game, active = g && g.status === 'playing', last = (g && g.bet) || 50;
  let table = '';
  if (g) {
    const [msg, cls] = g.status === 'done' ? BJ_MSG[g.outcome] : ['', ''];
    table = `<div class="mute">딜러 ${g.status === 'done' ? g.dv.total : g.dv.total + ' + ?'}${g.status === 'done' && g.dv.total > 21 ? ' (버스트)' : ''}</div><div class="hand-row">${g.dealer.map(cardHtml).join('')}</div>
      <div class="mute" style="margin-top:8px">나 ${g.pv.total}${g.pv.soft && g.pv.total <= 21 ? ' (A를 11로 계산 중)' : ''} · 건 돈 ${g.wagered}🪙${g.doubled ? ' (더블다운)' : ''}</div><div class="hand-row">${g.player.map(cardHtml).join('')}</div>
      ${g.status === 'done' ? `<p class="${cls}" style="font-size:18px;margin:10px 0 4px">${msg} <b>${netText(g.net)}</b></p>${g.capped ? '<div class="mute">⚠️ 오늘 한도에 도달해서 당첨금이 일부만 지급됐습니다.</div>' : ''}` : ''}`;
  }
  const actions = active
    ? `<div class="betrow"><button class="pri" onclick="bjAct('hit')">✋ 히트</button><button class="pri" onclick="bjAct('stand')">🛑 스탠드</button>${g.can_double ? `<button onclick="bjAct('double')">✌️ 더블다운 (+${g.bet}🪙)</button>` : ''}</div>`
    : `<div class="betrow" style="margin-top:10px"><input id="bjbet" type="number" min="${bj.rules.MIN_BET}" max="${bj.rules.MAX_BET}" step="10" value="${last}"><button class="pri" onclick="bjStart()" ${bj.limits && bj.limits.blocked ? 'disabled' : ''}>${g ? '새 판 시작' : '시작'}</button></div><div class="mute">건 돈 ${bj.rules.MIN_BET}~${bj.rules.MAX_BET}🪙</div>`;
  const rec = bj.recent.length ? bj.recent.map((r) => `<div class="rec"><span>${OUT_TXT[r.outcome]}</span><span class="mute">${r.wagered}🪙 걸고</span><b class="${netCls(r.net)}">${netText(r.net)}</b></div>`).join('') : '<p class="mute">아직 기록이 없습니다.</p>';
  return `<div class="card"><h2>🃏 블랙잭</h2>${soloBar(bj.limits)}${table || '<div class="mute">딜러와 21에 가까운 쪽이 이기는 카드 게임입니다. 처음이면 아래 설명을 먼저 읽어보십시오!</div>'}${actions}</div><div class="card">${BJ_RULES.replace('%OPEN%', bj.recent.length ? '' : 'open')}</div><div class="card"><h2>내 최근 기록</h2>${rec}</div>`;
}
const bjStart = guard(async () => { bj = await api('POST', '/api/blackjack/start', { bet: Number($('#bjbet').value) }); bjAfter(); });
const bjAct = guard(async (act) => {
  if (act === 'double' && !await ask('건 돈을 2배로 올리고 카드 한 장만 받고 끝냅니다. 합니까?')) return;
  bj = await api('POST', '/api/blackjack/' + act, {}); bjAfter();
});
async function bjAfter() { if (bj.game && bj.game.status === 'done') { const [m] = BJ_MSG[bj.game.outcome]; toast(`${m} ${netText(bj.game.net)}${bj.game.capped ? ' (오늘 한도까지만 지급)' : ''}`); } render(); await refresh(); }

/* ---- 🎰 슬롯머신 ---- */
function slotTable() {
  if (!slotData) return '<p class="mute">불러오는 중…</p>';
  const d = slotData, pay = d.symbols.map((s, i) => `<div class="row"><span style="font-size:20px">${s}${s}${s}</span><b class="pts">×${d.triple[i]}</b></div>`).join('');

    ${soloBar(d.limits)}<div class="reels">${slotUi.reels.map((s) => `<div class="reel">${s}</div>`).join('')}</div>
    ${slotUi.msg ? `<p class="${slotUi.cls}" style="text-align:center;font-size:18px;margin:4px 0 10px">${slotUi.msg}</p>` : ''}

    <div class="row"><span style="font-size:20px">🍒🍒 <span class="mute" style="font-size:13px">(🍒 정확히 2개)</span></span><b class="pts">×${d.cherry2}</b></div>
    <div class="row"><span style="font-size:20px">🍒 <span class="mute" style="font-size:13px">(🍒 정확히 1개)</span></span><b class="pts">×${d.cherry1}</b></div>
    <p class="mute">그 외 조합은 꽝입니다. 그림이 나올 가능성은 🍒가 가장 높고 7️⃣이 가장 낮습니다. 오래 하면 평균적으로 건 돈의 약 91%를 돌려받습니다(딜러가 조금 유리합니다). 당첨금은 소수점 이하를 버립니다.</p></div>
    <div class="card"><h2>내 최근 기록</h2>${rec}</div>`;
}
const spinSlots = guard(async () => {
  if (slotUi.busy) return;
  const bet = Number($('#sbet').value), syms = slotData.symbols;
  slotUi.busy = true; slotUi.msg = ''; slotUi.bet = bet;
  const t = setInterval(() => { document.querySelectorAll('.reel').forEach((e) => { e.textContent = syms[Math.floor(Math.random() * syms.length)]; }); }, 70);
  try {
    const [r] = await Promise.all([api('POST', '/api/slots/spin', { bet }), new Promise((res) => setTimeout(res, 800))]);
    slotUi.reels = r.reels;
    slotUi.msg = (r.mult > 0 ? `당첨! ×${r.mult} ${netText(r.net)}` : `아쉽습니다 ${netText(r.net)}`) + (r.capped ? ' · 오늘 한도까지만 지급' : ''); slotUi.cls = r.net > 0 ? 'win' : r.net < 0 ? 'lose' : 'mute';
  } finally { clearInterval(t); slotUi.busy = false; }
  await refresh(); try { slotData = await api('GET', '/api/slots'); } catch (e) { /* 무시 */ } render();
});

/* ---- 💸 돈뿌리기 / 🙏 구걸하기 ---- */

/* ===== 시작: 아티팩트 저장소 연결 ===== */
let ENGINE = null, ENG_ERR = '';
async function boot() {
  try {
    const c = window.claude;
    if (!c || !c.use) throw new Error('Claude에서 열어야 합니다. 아티팩트 링크로 들어오십시오.');
    const [db, userNs] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !userNs) throw new Error('이 페이지는 Claude에 로그인한 상태에서만 열립니다. 로그인한 뒤 다시 열어주십시오.');
    const uid = await userNs.id();
    if (!uid) throw new Error('계정 정보를 확인할 수 없습니다. 로그인한 뒤 다시 열어주십시오.');
    const canWrite = await userNs.can('data.write');
    if (canWrite === false) throw new Error('읽기 전용 권한입니다. 도박장 주인에게 "Contributor(참여자)" 권한으로 초대해 달라고 요청하십시오.');
    const eng = new ArtifactEngine({ db, uid, isOwner: await userNs.isOwner(), makeGS });
    await eng.start();
    ENGINE = eng;
    ENGINE.onChange(() => { if (!document.hidden) refresh(); });
    if (ENGINE.myUser()) { const r = await ENGINE.enter(); if (!r.error) token = r.data.token; }
  } catch (e) { ENG_ERR = e.message || '연결하지 못했습니다.'; }
  render(); refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 3000);
}
boot();

/* ===== 화면 안의 확인·입력 창 ===== */
let modalQ = Promise.resolve();
function showModal(opts) {
  return new Promise((resolve) => {
    modalQ = modalQ.then(() => new Promise((done) => {
      const m = document.getElementById('modal');
      m.innerHTML = `<div class="mbox"><div class="mmsg"></div>${opts.input ? '<input id="minput" autocomplete="off">' : ''}<div class="mbtn"><button id="mno">취소</button><button class="pri" id="myes">확인</button></div></div>`;
      m.querySelector('.mmsg').textContent = opts.msg;
      const inp = m.querySelector('#minput'); if (inp) inp.value = opts.def || '';
      m.hidden = false;
      const close = (v) => { m.hidden = true; m.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); done(); };
      const onKey = (e) => { if (e.key === 'Escape') close(opts.input ? null : false); if (e.key === 'Enter' && inp) close(inp.value); };
      document.addEventListener('keydown', onKey);
      m.querySelector('#myes').onclick = () => close(opts.input ? inp.value : true);
      m.querySelector('#mno').onclick = () => close(opts.input ? null : false);
      (inp || m.querySelector('#myes')).focus();
    }));
  });
}
const ask = (msg) => showModal({ msg });
const askText = (msg, def) => showModal({ msg, input: true, def });
const askThen = async (msg, fn) => { if (await ask(msg)) fn(); };
window.ask = ask; window.askText = askText; window.askThen = askThen;
const openAdmin = () => { window.__adminMode = true; ADM.open(); };
const closeAdmin = () => { window.__adminMode = false; ADM.close(); render(); };
window.openAdmin = openAdmin; window.closeAdmin = closeAdmin;

// 글자 🪙 → 게임칩 (화면에 새로 들어오는 글자마다 바꿈)
(function () {
  const walk = (root) => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), hits = [];
    for (let n = w.nextNode(); n; n = w.nextNode()) if (n.nodeValue.includes('🪙') && !/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)) hits.push(n);
    for (const n of hits) {
      const parts = n.nodeValue.split('🪙'), f = document.createDocumentFragment();
      parts.forEach((t, i) => { if (i) { const c = document.createElement('i'); c.className = 'chip'; f.append(c); } if (t) f.append(t); });
      n.replaceWith(f);
    }
  };
  new MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) { if (n.nodeType === 1) walk(n); else if (n.nodeType === 3 && n.nodeValue.includes('🪙')) walk(n.parentNode); } })
    .observe(document.documentElement, { childList: true, subtree: true });
})();

const ADM = (function () {
let timer = null;
let data = null;

async function api(method, url, body) {
  const j = await ENGINE.call('', method, url, body || {});
  if (j.error) { const e = new Error(j.error); e.code = j.code; throw e; }
  return j.data;
}
const load = async () => { try { data = await api('GET', '/api/admin/overview'); render(); } catch (e) { $('#app').innerHTML = `<div class="row"><h1>🔒 관리자</h1><button onclick="closeAdmin()">← 도박장</button></div><div class="card">${esc(e.message)}<br><span class="mute">관리자 시트는 다른 사람에게 공유하지 마십시오.</span></div>`; } };

const userAct = guard(async (user_id, action, value) => {
  if (action === 'delete' && !await ask('이 유저를 삭제합니까?')) return;
  await api('POST', '/api/admin/user', { user_id, action, value }); toast('완료'); await load();
});
const askPoints = async (id, action) => { const v = await askText(action === 'set_points' ? '새 칩?' : '더할 칩? (빼려면 -100)'); if (v !== null && v !== '') userAct(id, action, Number(v)); };
const askName = async (id) => { const v = await askText('새 닉네임?'); if (v) userAct(id, 'rename', v); };
const askPin = async (id) => { const v = await askText('새 PIN (공백 없이 4~16자). 방은 그대로입니다.'); if (v) userAct(id, 'reset_pin', v); };
const askRoom = async (id) => { const v = await askText('옮길 방 코드 (글자/숫자 4~12자). 없는 코드면 방이 새로 만들어집니다.'); if (v) userAct(id, 'move_room', v); };
const betAct = guard(async (bet_id, action, option_id) => {
  const msg = { delete: '도박을 삭제합니까? (진행 중이면 환불)', cancel: '취소하고 전액 환불합니까?', resolve: '이 선택지를 정답으로 확정합니까?' }[action];
  if (msg && !await ask(msg)) return;
  await api('POST', '/api/admin/bet', { bet_id, action, option_id }); toast('완료'); await load();
});
const delMsg = guard(async (id) => { await api('POST', '/api/admin/chat', { id }); await load(); });
const saveSettings = guard(async () => {
  const values = {};
  for (const sp of data.settings) {
    const el = document.getElementById('st_' + sp.key);
    if (sp.type === 'bool') values[sp.key] = el.checked;
    else { const n = Number(el.value); if (el.value.trim() === '' || !Number.isInteger(n)) throw new Error(`${sp.label}: 정수를 넣어주십시오.`); values[sp.key] = n; }
  }
  await api('POST', '/api/admin/settings', { values }); toast('⚙️ 저장했습니다. 바로 적용됩니다'); await load();
});
const resetSetting = guard(async (key) => { await api('POST', '/api/admin/settings', { reset: [key] }); toast('기본값으로 되돌렸습니다'); await load(); });
const resetAllSettings = guard(async () => {
  if (!await ask('모든 설정을 기본값으로 되돌리시겠습니까?')) return;
  await api('POST', '/api/admin/settings', { reset: data.settings.map((x) => x.key) }); toast('모두 기본값으로 되돌렸습니다'); await load();
});
const closeRoom = guard(async (kind, id) => {
  if (!await ask('이 방을 닫습니까? 참가자 모두에게 판돈이 환불됩니다.')) return;
  await api('POST', '/api/admin/room', { kind, room_id: id }); toast('방을 닫고 환불했습니다'); await load();
});
const delGroup = guard(async (i) => {
  const g = data.groups[i];
  const t = await askText(`⚠️ 방 "${g.label}"(${g.members.join(', ') || '비어 있음'})을 통째로 지웁니다.\n그 방의 계정·칩·도박·채팅·게임 기록이 전부 사라지고 되돌릴 수 없습니다.\n\n정말 지우려면 "삭제"라고 입력하십시오.`);
  if (t !== '삭제') return;
  const r = await api('POST', '/api/admin/group', { grp: g.id }); toast(`방을 지웠습니다 (계정 ${r.deleted_users}개)`); await load();
});
const gift = guard(async () => {
  const v = Number($('#gift').value);
  if (!await ask(`모든 유저에게 ${v}🪙을 지급하시겠습니까?`)) return;
  await api('POST', '/api/admin/gift', { amount: v }); toast('🎁 지급 완료'); await load();
});

function render() {
  const st = data.stats;
  const S = { open: '진행', closed: '마감', resolved: '확정', cancelled: '취소' };
  $('#app').innerHTML = `<div class="row"><h1 style="margin:0">🛠 관리자 콘솔</h1><button onclick="closeAdmin()">← 도박장</button></div>
  <div class="stats">
    <div class="stat">유저<b>${st.users}</b></div><div class="stat">유통 🪙<b>${st.points.toLocaleString()}</b></div>
    <div class="stat">총 베팅 수<b>${st.wagers}</b></div><div class="stat">총 베팅액<b>${st.wagered.toLocaleString()}🪙</b></div>
    <div class="stat">🍀 럭키 당첨<b>${st.lucky}</b></div></div>
  <div class="card"><h2>⚙️ 설정 <span class="mute">(저장하면 바로 적용됩니다)</span></h2>
    ${data.settings.map((sp) => `<div class="set"><div><b>${esc(sp.label)}</b><div class="mute">${esc(sp.hint || '')} · 기본값 ${sp.type === 'bool' ? (sp.default ? '켜짐' : '꺼짐') : sp.default}</div></div>
      <div class="acts">${sp.type === 'bool' ? `<label class="sw"><input id="st_${sp.key}" type="checkbox" ${sp.value ? 'checked' : ''}> ${'켜기'}</label>` : `<input id="st_${sp.key}" type="number" min="${sp.min}" max="${sp.max}" value="${sp.value}">`}
      ${sp.value !== sp.default ? `<button onclick="ADM.resetSetting('${sp.key}')" title="기본값으로">↺</button>` : ''}</div></div>`).join('')}
    <div class="acts" style="margin-top:10px"><button class="pri" onclick="ADM.saveSettings()">저장</button><button onclick="ADM.resetAllSettings()">전부 기본값으로</button></div></div>
  <div class="card"><h2>🚪 방 <span class="mute">(방 코드가 같은 사람들끼리)</span></h2>${data.groups.map((g, i) => `<div class="item2"><div><span class="tag">방 ${esc(g.label)}</span> <b>${g.count}명</b> <span class="mute">· 칩 합 ${g.points.toLocaleString()} · 도박 ${g.bets}개 · 열린 게임 방 ${g.rooms}개</span>
      <div class="mute">${g.members.map(esc).join(', ')}</div></div><button class="danger" onclick="ADM.delGroup(${i})">방 삭제</button></div>`).join('') || '<p class="mute">없음</p>'}</div>
  <div class="card"><h2>🎮 열려 있는 게임 방 <span class="mute">(참가자를 기다리는 중 · 낸 패/숫자는 보이지 않습니다)</span></h2>${data.rooms.map((r) => `<div class="item2"><div><span class="tag">${{ rps: '✊ 가위바위보', lun: '🤫 최저 유일 숫자', lad: '🪜 사다리' }[r.kind]}</span> <b>${esc(r.host)}</b> <span class="mute">· 판돈 ${r.stake}🪙 · ${r.players.length}/${r.cap}명 · 방 ${esc(r.grp || '없음')} · ${new Date(r.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
      <div class="mute">${r.players.map(esc).join(', ')}</div></div><button class="danger" onclick="ADM.closeRoom('${r.kind}',${r.id})">닫기(환불)</button></div>`).join('') || '<p class="mute">열려 있는 게임 방이 없습니다.</p>'}</div>
  <div class="card"><h2>🎁 전체 지급</h2><input id="gift" type="number" placeholder="지급할 🪙"> <button class="pri" onclick="ADM.gift()">모두에게 주기</button></div>
  <div class="card"><h2>유저</h2><table>${data.users.map((u) => `<tr><td><b>${esc(u.name)}</b> ${u.approved === 0 ? '<span class="tag" style="color:var(--dog)">승인 대기</span> <button class="pri" onclick="ADM.userAct(' + u.id + ',\'approve\')">승인</button>' : ''} ${u.grp ? `<span class="tag" title="방 코드">방 ${esc(u.grp)}</span>` : '<span class="tag">방 없음</span>'}</td><td>${u.points.toLocaleString()}🪙</td><td><div class="acts">
    <button onclick="ADM.askPoints(${u.id},'add_points')">± 더하기</button><button onclick="ADM.askPoints(${u.id},'set_points')">= 설정</button>
    <button onclick="ADM.askName(${u.id})">닉네임</button><button onclick="ADM.userAct(${u.id},'clear_device')" title="이 계정에 묶인 기기를 풀어, 그 기기에서 새 계정을 만들 수 있게 합니다">기기 해제</button><button onclick="ADM.askPin(${u.id})">PIN 초기화</button><button onclick="ADM.askRoom(${u.id})">방 변경</button><button class="danger" onclick="ADM.userAct(${u.id},'delete')">삭제</button></div></td></tr>`).join('')}</table></div>
  <div class="card"><h2>💬 최근 채팅</h2>${data.messages.map((m) => `<div class="mute"><b style="color:var(--cyan)">${esc(m.name)}</b>${m.bet_title ? ` <span class="tag">${esc(m.bet_title)}</span>` : ''}: ${esc(m.text)} <button class="danger" style="padding:0 6px" onclick="ADM.delMsg(${m.id})">삭제</button></div>`).join('') || '<p class="mute">없음</p>'}</div>
  <div class="card"><h2>도박</h2>${data.bets.map((b) => `<div style="border-bottom:1px solid var(--line);padding:8px 0">
    <b>${esc(b.title)}</b> <span class="tag">${S[b.status]}</span> <span class="mute">by ${esc(b.creator)} · 총 ${b.total}🪙</span>
    <div class="opts mute">${b.options.map((o) => `${b.winner === o.id ? '🏆' : ''}${esc(o.label)} (${o.pool}🪙/${o.bettors}명) ${b.status === 'open' || b.status === 'closed' ? `<button onclick="ADM.betAct(${b.id},'resolve',${o.id})">정답</button>` : ''}`).join(' · ')}</div>
    <div class="acts" style="margin-top:4px">${b.status === 'open' ? `<button onclick="ADM.betAct(${b.id},'close')">마감</button>` : ''}${b.status === 'open' || b.status === 'closed' ? `<button onclick="ADM.betAct(${b.id},'cancel')">취소(환불)</button>` : ''}<button class="danger" onclick="ADM.betAct(${b.id},'delete')">삭제</button></div></div>`).join('') || '<p class="mute">도박이 없습니다.</p>'}</div>`;
}



return { resetSetting, saveSettings, resetAllSettings, delGroup, closeRoom, gift, userAct, askPoints, askName, askPin, askRoom, delMsg, betAct, open() { load(); timer = setInterval(() => { if (document.activeElement?.tagName !== 'INPUT' && !document.hidden) load(); }, 5000); }, close() { clearInterval(timer); } };
})();
</script>
