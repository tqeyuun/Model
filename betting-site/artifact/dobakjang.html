<title>도박장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

/* 도박장 화면: 어두운 남색 바탕 + 금색 강조의 카지노·배팅 사이트풍. 번쩍임 없이 글자와 숫자가 먼저 보이게 */
:root{--bg:#0b0e14;--panel:#0f141d;--card:#151b27;--card2:#1c2433;--ink:#f1f3f8;--mute:#9aa4b5;--line:#2a3447;
 --gold:#f5b82e;--gold2:#b8860b;--red:#e5484d;--blue:#4f9dff;--win:#34d27b;--lose:#ff6369;
 --c0:#4f9dff;--c1:#e5484d;--c2:#34d27b;--c3:#f5b82e;--c4:#a78bfa;--c5:#fb923c;
 --pri:#f5b82e;--pink:#e5484d;--cyan:#4f9dff;--dog:#f5b82e;--display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;min-height:100vh;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--gold2);position:sticky;top:0;z-index:5}
header b{font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:.5px;color:var(--gold)}
.lg{display:flex;align-items:center;gap:8px}.dice{font-size:24px;line-height:1}
header #who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:14px;font-weight:700}
header #who .pts{background:#080b11;border:1px solid var(--gold2);padding:3px 10px;border-radius:99px}
.pts{font-weight:800;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
h2{font-size:17px;font-weight:800;margin:0 0 6px;color:var(--ink)}.card h2 .mute{font-weight:400}
.mute{color:var(--mute);font-size:13px}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:10px 12px;background:#0a0e15;color:var(--ink);outline:none}
input{width:100%;margin:4px 0}input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,184,46,.25)}
input::placeholder{color:#6f7a8d}
button{cursor:pointer;white-space:nowrap;background:var(--card2);font-weight:600}button:hover:not(:disabled){background:#243049}button:active:not(:disabled){transform:scale(.98)}
button.pri{background:var(--gold);border-color:var(--gold);color:#1a1300;font-weight:800}button.pri:hover:not(:disabled){background:#ffc94a}
button.danger{background:#3a1519;border-color:#7a2a30;color:#ff9a9e}
button:disabled{opacity:.4;cursor:default}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.tabs button{border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:800;font-size:15px;padding:12px 4px;color:var(--ink)}
.tabs button.on{background:var(--gold);color:#1a1300}
.tabs.mode{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs.mode button{flex:1 1 calc(50% - 6px);border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px;padding:10px 6px}
.tabs.mode button.on{background:#2a2108;border-color:var(--gold);color:var(--gold)}
.tabs.mode button.wide{flex:1 1 100%}
.opt{--c:var(--c0);margin:10px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--panel)}
.opt .lbl{font-weight:800;font-size:16px;color:var(--ink)}
.bar{height:6px;background:#0a0e15;border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--c,var(--blue));transition:width .5s}
.opt.dog{border-color:#8a5a00;border-left-color:var(--gold);background:#1d1706}.opt.dog .bar i{background:var(--gold)}
.opt.won{border-color:var(--win);border-left-color:var(--win);background:#0f2218}.opt.won .bar i{background:var(--win)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;background:var(--gold);color:#1a1300;margin-left:6px;vertical-align:middle}
.tag.s{background:#16233a;color:var(--blue);border:1px solid #28406a}
.win{color:var(--win);font-weight:800}.lose{color:var(--lose);font-weight:800}
.lucky{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:4px;font-weight:800;color:#1a1300;background:var(--gold)}
.betrow{display:flex;gap:6px;margin-top:6px}.betrow input{margin:0}
.msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1c2433;border:1px solid var(--gold);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:10px;z-index:9;max-width:90%}
table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mute);font-weight:700}
td:nth-child(n+3),th:nth-child(n+3){text-align:right}
tr:nth-child(2) td:first-child{color:#ffd24d;font-weight:800}tr:nth-child(3) td:first-child{color:#c9ced8;font-weight:800}tr:nth-child(4) td:first-child{color:#d68a4a;font-weight:800}
tr:nth-child(2){background:rgba(245,184,46,.07)}
#chatbox{height:50vh;overflow-y:auto;padding:8px;margin:8px 0;background:#0a0e15;border:1px solid var(--line);border-radius:10px}
.cm{margin:8px 0;max-width:85%}.cm.me{margin-left:auto;text-align:right}
.cn{font-size:12px;font-weight:700}.cn span{color:var(--mute);font-weight:400;margin-left:4px}
.cb{display:inline-block;padding:6px 12px;border-radius:10px;background:var(--card2);word-break:break-word;text-align:left}
.cm.me .cb{background:var(--gold);color:#1a1300;font-weight:600}
.ttl{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;margin-right:5px;border-radius:4px;color:#1a1300;background:var(--gold);vertical-align:middle}
.nm{font-weight:700}
.nm.fx-glow{color:#fff;text-shadow:0 0 6px #4f9dff,0 0 14px #a855f7}
.nm.fx-fire{background:linear-gradient(0deg,#ff2d00,#ffb800,#fff176);-webkit-background-clip:text;background-clip:text;color:transparent}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item.eq{border-color:var(--win)}.item .pv{min-height:26px}.item button{width:100%}
.room{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.room.mine{border-color:var(--gold2);background:#17130a}
.hands{display:flex;gap:8px;margin-top:8px}
.hand{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;padding:10px 4px}
.hand span{font-size:30px;line-height:1.1}
.hands.pick{margin:12px 0}.hand.sel{border-color:var(--gold);background:#2a2108}
.rec{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.rec.me{background:rgba(245,184,46,.07)}
.card.done{opacity:.5}.card.done:hover{opacity:.9}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.nums.n4{grid-template-columns:repeat(4,1fr)}.nums.n5{grid-template-columns:repeat(5,1fr)}.nums.n6{grid-template-columns:repeat(3,1fr)}
.num{padding:10px 0;font-weight:800;font-size:16px}.num.sel{border-color:var(--gold);background:#2a2108;color:var(--gold)}
.seats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seat{padding:6px 12px;border-radius:6px;border:1px dashed var(--line);font-size:13px;color:var(--mute)}.seat.on{border-style:solid;color:var(--ink);background:var(--card2)}.seat.mine{border-color:var(--gold)}
button.seat.free{border-style:solid;border-color:var(--blue);color:var(--blue);cursor:pointer;background:transparent}
.pn{display:inline-block;padding:1px 9px;border-radius:4px;background:var(--card2);margin:2px;font-size:13px;border:1px solid transparent}.pn.uq{border-color:var(--blue)}.pn.win{background:#10281b;border-color:var(--win)}
.card.sub{padding:10px}.card.sub.me{border-color:var(--gold2)}
.lv,.lr{stroke:#4a566e;stroke-width:3;stroke-linecap:round}
.rules p,.rules ul,.rules ol{margin:6px 0}.rules li{margin:4px 0}.rules summary{cursor:pointer;font-size:16px;font-weight:700}.rules b{color:var(--gold)}.rules ul,.rules ol{padding-left:20px}
.hand-row{display:flex;flex-wrap:wrap;margin:4px 0}
.pc{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:60px;margin:3px;border-radius:6px;background:#f5f5fa;color:#111;font-weight:800;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.pc.red{color:#d92d3a}.pc.back{background:repeating-linear-gradient(45deg,#1d4ed8,#1d4ed8 6px,#1e3a8a 6px,#1e3a8a 12px);color:#fff}
.reels{display:flex;gap:8px;justify-content:center;margin:14px 0}.reel{width:78px;height:78px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#0a0e15;border:2px solid var(--gold2);border-radius:10px}
.limit{background:#0a0e15;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
.member .kick{padding:0 6px;margin-left:4px;font-size:12px;line-height:18px;border-radius:9px;color:#ff8a8f;border-color:#7a2a30}
.sec{margin:20px 2px 8px;font-size:15px;font-weight:800;border-left:4px solid var(--gold);padding-left:8px}.sec .mute{font-weight:400}
.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.member{padding:4px 10px;border-radius:6px;background:var(--card2);border:1px solid var(--line);font-size:14px}.member.me{border-color:var(--gold)}
/* ---- 🧱 블록 블라스트 ---- */
:root{--b0:#ff5d6c;--b1:#ff9f43;--b2:#ffd43b;--b3:#38d9a9;--b4:#4dabf7;--b5:#9775fa;--b6:#f783ac}
.bbx{--cs:min(calc((100vw - 28px - 28px - 39px) / 8),44px);user-select:none;-webkit-user-select:none}
.bbtop{display:flex;gap:8px;margin-bottom:10px}.bbbox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;text-align:right}
.bbbox small{display:block;color:var(--mute);font-size:11px;font-weight:700}.bbbox b{font-size:20px;font-weight:900}.bbbox.gold b{color:var(--gold)}
.bbwrap{position:relative;width:calc(var(--cs)*8 + 21px + 18px);margin:0 auto}
.bbboard{display:grid;grid-template-columns:repeat(8,var(--cs));grid-template-rows:repeat(8,var(--cs));gap:3px;padding:8px;background:#0a0e15;border:1px solid var(--line);border-radius:12px;touch-action:none}
.bbc{border-radius:6px;background:#161d2c}.bbc:nth-child(odd){background:#131a28}
.bbc.f{background:var(--k);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.28)}
.bbc.pop{animation:bbpop .18s ease-out}.bbc.ok{background:color-mix(in srgb,var(--k) 55%,#161d2c)}.bbc.bad{background:rgba(255,93,108,.35)}.bbc.line{outline:2px solid rgba(245,184,46,.95);outline-offset:-2px}
.bbc.clr{animation:bbclr .32s ease-in forwards}
@keyframes bbpop{0%{transform:scale(.7)}100%{transform:scale(1)}}@keyframes bbclr{0%{filter:brightness(1)}40%{transform:scale(1.12);filter:brightness(1.8)}100%{transform:scale(0);opacity:0}}
.bbtray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bbslot{height:calc(var(--cs)*2.5);display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;touch-action:none}.bbslot.empty{opacity:.35}
.bbpc{display:grid;cursor:grab;touch-action:none}.bbpc.dim{opacity:.35}.bbpc i{display:block;border-radius:5px;background:transparent}
.bbpc i.f{background:var(--k);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.28)}
.bbghost{position:fixed;left:0;top:0;pointer-events:none;z-index:20;display:none;opacity:.95;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.bbfloat{position:absolute;left:50%;top:40%;font-weight:900;font-size:28px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.6);pointer-events:none;animation:bbup .9s ease-out forwards;white-space:nowrap;z-index:6}.bbfloat.big{font-size:36px;color:#fff}
@keyframes bbup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px)}}
.bbover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,11,20,.85);border-radius:12px;z-index:8}.bbover.on{display:flex}
.bbcard{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:18px 20px;text-align:center;max-width:90%}.bbbig{font-size:38px;font-weight:900;line-height:1.1}
/* 🪙 → 게임칩: 글자 🪙 가 화면에 들어오면 아래 스크립트가 이 칩 모양으로 바꿔 끼움 */
.chip{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;vertical-align:-.2em;margin:0 .1em;box-sizing:border-box;
  background:radial-gradient(circle,#d62839 0 30%,#fff 31% 38%,#d62839 39% 47%,transparent 48%),repeating-conic-gradient(#fff 0 16deg,#a31621 16deg 45deg);
  border:.07em solid #fff}

:root{color-scheme:dark}
/* 위쪽 배너 */
.banner{display:block;max-width:640px;margin:12px auto 0;padding:0 14px}.banner img{display:block;width:100%;height:auto;border-radius:0;border:0}
/* 관리자 화면 */

h1{margin:6px 0 12px;font-size:22px;background:linear-gradient(90deg,var(--pink),var(--dog));-webkit-background-clip:text;background-clip:text;color:transparent}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

.stat{background:#07070c;border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px;color:var(--cyan);text-shadow:0 0 10px rgba(34,211,238,.6)}
button:hover{filter:brightness(1.3)}

.acts{display:flex;gap:4px;flex-wrap:wrap}

.opts button{margin:2px}

.set{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set input[type=number]{width:120px}
.sw{display:flex;gap:6px;align-items:center}
.sw input{width:auto}

.item2{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}


/* 글꼴: 본문은 Noto Sans KR, 로고·제목·점수는 Black Han Sans (구글 폰트가 안 불러와져도 기본 글꼴로 보임) */
:root{--display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif}

h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.3px}

h2 .mute{font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:400;letter-spacing:0}
/* 화면 안의 확인·입력 창 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.mmsg{white-space:pre-wrap;margin-bottom:12px}.mbox input{width:100%;margin-bottom:12px}.mbtn{display:flex;gap:8px;justify-content:flex-end}

</style>

<script>
/**
 * 아티팩트용 저장소 엔진.
 * 구글 앱스 스크립트 버전의 규칙 코드(Code.gs)를 그대로 쓰고, 시트 대신 아티팩트의 공유 DB(claude.use('db'))에 저장합니다.
 *
 * - 읽기: 실시간 구독으로 유지되는 메모리 사본에서 바로 (빠름)
 * - 쓰기(POST): DB 의 짧은 임대(acquire)로 한 번에 한 사람씩 → 최신 상태로 맞춘 뒤 규칙 실행 → 바뀐 문서만 저장
 * - 채팅은 새 문서를 추가할 뿐이라 임대 없이 바로 저장
 */
(function (root) {
  'use strict';
  var PERSIST = ['users', 'bets', 'options', 'wagers', 'items', 'rooms', 'rps', 'lun', 'lunp', 'lad', 'ladp', 'bj', 'slots', 'bb', 'bbr', 'bbrp', 'drops', 'dropc', 'begs', 'begg'];
  var LOCAL = ['sessions'];                       // 이 브라우저에만 있는 표 (로그인 표시)
  var MESSAGES = 'messages';                      // 채팅: 최근 것만 구독, 임대 없이 추가
  var MSG_LIMIT = 400;
  var LEASE_MS = 1200;

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function byId(a, b) { return a.id - b.id; }

  function Engine(opts) {
    var self = this;
    this.db = opts.db;
    this.uid = opts.uid;                          // 이 사람의 아이디 (user.id())
    this.isOwner = !!opts.isOwner;
    this.makeGS = opts.makeGS;                    // (ctx) => 규칙 코드 모듈
    this.tables = {};                             // name -> { map: Map(key -> row), arr: [row...] }
    this.dirty = new Map();                       // 'table/key' -> { table, key, data|null }
    this.pendingKeys = new Set();                 // 저장 중인 문서는 구독이 덮어쓰지 않게
    this.listeners = [];
    this.unsubs = [];
    this.settingsJson = '';
    this.settingsWrite = null;
    this.leaseHeld = false;
    this.needLock = false;
    this.rev = 0;
    this.lastFull = 0;
    this.ready = false;
    this.queue = Promise.resolve();               // 이 브라우저 안에서도 쓰기는 한 줄로
    PERSIST.concat(LOCAL, [MESSAGES]).forEach(function (n) { self.tables[n] = { map: new Map(), arr: [] }; });
    this.msgSeq = 0;

    var ctx = {
      rows: function (name) { return self._rows(name); },
      nextId: function (name) { return self._nextId(name); },
      add: function (name, row) { self._add(name, row); },
      touch: function (name, row) { self._touch(name, row); },
      del: function (name, row) { self._del(name, row); },
      isOwner: function () { return self.isOwner; },
      lockOk: function () { if (self.leaseHeld) return true; self.needLock = true; return false; },
      getProp: function (k) { return k === 'SETTINGS' ? self.settingsJson : undefined; },
      setProp: function (k, v) { if (k === 'SETTINGS') { self.settingsJson = v; self.settingsWrite = v; } },
    };
    this.ctx = ctx;
    this.gs = this.makeGS(ctx);
  }

  /* ---------- 메모리 사본 ---------- */
  Engine.prototype._rows = function (name) { var t = this.tables[name]; if (!t) throw new Error('없는 표: ' + name); return t.arr; };
  Engine.prototype._keyOf = function (name, row) {
    if (name === 'items') return row.user_id + '_' + row.item_id;
    return String(row.id);
  };
  Engine.prototype._nextId = function (name) {
    if (name === MESSAGES) return Date.now() * 1000 + (this.msgSeq = (this.msgSeq + 1) % 1000);   // 임대 없이 쓰므로 겹치지 않게 시간 기반
    var m = 0; this.tables[name].arr.forEach(function (r) { if (r.id > m) m = r.id; });
    return m + 1;
  };
  Engine.prototype._sortedInsert = function (name, row) {
    var t = this.tables[name]; t.arr.push(row);
    if (name !== 'items' && t.arr.length > 1 && t.arr[t.arr.length - 2].id > row.id) t.arr.sort(byId);
  };
  Engine.prototype._add = function (name, row) {

/** 파리뮤추얼 + 역배 보너스 + 럭키 보너스 (Node 버전과 동일 규칙) */
function settle(bet, winnerId) {
  var wagers = tbl('wagers').where(function (w) { return w.bet_id === bet.id; });
  var total = wagers.reduce(function (s, w) { return s + w.amount; }, 0);
  var winners = wagers.filter(function (w) { return w.option_id === winnerId; });
  var winPool = winners.reduce(function (s, w) { return s + w.amount; }, 0);
  if (winPool === 0 || winPool === total) { wagers.forEach(refund); return { refunded: true, total: total, underdog: false }; }
  var underdog = winPool / total < CFG.UNDERDOG_SHARE;
  var pot = total + (underdog ? Math.floor(total * CFG.UNDERDOG_BONUS) : 0), paid = 0;
  winners.forEach(function (w, i) {
    var base = i === winners.length - 1 && !underdog ? total - paid : Math.floor(pot * w.amount / winPool);
    paid += base;
    var lucky = Math.random() < CFG.LUCKY_CHANCE;
    var pay = base + (lucky ? Math.max(1, Math.floor(base * CFG.LUCKY_BONUS)) : 0);
    w.payout = pay; w.lucky = lucky ? 1 : 0; tbl('wagers').save(w); addPoints(w.user_id, pay);
  });
  wagers.forEach(function (w) { if (w.option_id !== winnerId) { w.payout = 0; tbl('wagers').save(w); } });
  return { refunded: false, total: total, underdog: underdog };
}

function betAction(bet, body) {
  if (bet.status === 'resolved' || bet.status === 'cancelled') fail(400, '이미 끝난 도박입니다.');
  if (body.action === 'close') { bet.status = 'closed'; tbl('bets').save(bet); return { ok: true }; }
  if (body.action === 'cancel') {
    tbl('wagers').where(function (w) { return w.bet_id === bet.id; }).forEach(refund);
    bet.status = 'cancelled'; tbl('bets').save(bet); return { ok: true };
  }
  if (body.action === 'resolve') {
    var oid = Number(body.option_id);
    var opt = tbl('options').find(function (o) { return o.id === oid && o.bet_id === bet.id; }) || fail(400, '정답 선택지를 골라주십시오.');
    var r = settle(bet, opt.id);
    bet.status = r.refunded ? 'cancelled' : 'resolved'; bet.winner = r.refunded ? '' : opt.id; tbl('bets').save(bet);
    return { ok: true, refunded: r.refunded, total: r.total, underdog: r.underdog };
  }
  fail(400, '알 수 없는 동작입니다.');
}

  else {

    var pot = room.stake * ps.length, share = Math.floor(pot / winners.length);

function removeUser(u) {   // 계정 삭제 (관리자 삭제·추방 공용). 진행 중인 도박/게임에 걸려 있으면 거부

  }

}

function markRpsSeen(id) { try { const a = JSON.parse(LS.get('rpsSeen') || '[]'); if (!a.includes(id)) LS.set('rpsSeen', JSON.stringify(a.concat(id))); } catch { /* 무시 */ } }

async function fetchLun() { lun = await api('GET', '/api/lun'); watch.lun = lun.rooms.some((r) => r.joined); notifyMulti('lun', lun.recent, '🤫 최저 유일 숫자'); }

async function loadGame() {
  if (!token) return;
  const view = curView();
  try {
    if (view === 'lun') await fetchLun();
    else if (view === 'lad') await fetchLad();
    else if (view === 'drop' || view === 'beg') { const d = await api('GET', '/api/gifts'); if (curView() !== view) return; gift = d; }
    else if (view === 'all') await Promise.all([fetchLun(), fetchLad(), fetchBbw()]);
    else if (view === 'bj') { const d = await api('GET', '/api/blackjack'); if (curView() !== 'bj') return; bj = d; }
    else if (view === 'bb') { const d = await api('GET', '/api/blockblast'); bbData = d; await fetchBbw(); }
    else if (view === 'slots') { const d = await api('GET', '/api/slots'); if (curView() !== 'slots') return; slotData = d; }
    else return;
  } catch (e) { return; }
  if (curView() === view && !(document.activeElement && document.activeElement.tagName === 'INPUT') && !slotUi.busy) render();
}
async function gamesTick() {
  const view = curView();
  if (!gamesInit) { gamesInit = true; try { await Promise.all([fetchLun(), fetchLad(), fetchBbw()]); } catch (e) { /* 무시 */ } }
  else {
    if (watch.lun && view !== 'lun' && view !== 'all') { try { await fetchLun(); } catch (e) { /* 무시 */ } }
    if (watch.bbw && view !== 'bb' && view !== 'all') { try { await fetchBbw(); } catch (e) { /* 무시 */ } }
    if (watch.lad && view !== 'lad' && view !== 'all') { try { await fetchLad(); } catch (e) { /* 무시 */ } }
  }
  await loadGame();
}

const LAD_RULES = `<details %OPEN% class="rules"><summary><b>🪜 사다리타기란 무엇입니까?</b></summary>
  <p>방장이 <b>인원(2~6명)과 판돈</b>을 정하고 방을 열습니다. 사람들이 <b>자리(번호)를 골라 앉습니다.</b> 모두 같은 판돈을 냅니다.</p>

const LCOL = ['#22d3ee', '#ff2d95', '#ffb800', '#34f5a0', '#a855f7', '#ff6b3d'];
function ladderSvg(r) {
  const N = r.slots, R = r.rungs.length, W = Math.max(240, N * 62), H = 250, top = 38, bot = H - 40, gap = (bot - top) / R;
  const x = (i) => 28 + i * (W - 56) / Math.max(1, N - 1), yy = (ri) => top + (ri + 0.5) * gap;
  let g = '';
  for (let i = 0; i < N; i++) g += `<line class="lv" x1="${x(i)}" y1="${top}" x2="${x(i)}" y2="${bot}"/>`;
  r.rungs.forEach((row, ri) => row.forEach((i) => { g += `<line class="lr" x1="${x(i)}" y1="${yy(ri)}" x2="${x(i + 1)}" y2="${yy(ri)}"/>`; }));
  r.seats.forEach((s) => {
    const win = s.end === r.win_end, pts = [[x(s.path[0]), top]];
    for (let ri = 0; ri < R; ri++) { pts.push([x(s.path[ri]), yy(ri)]); pts.push([x(s.path[ri + 1]), yy(ri)]); }
    pts.push([x(s.path[R]), bot]);
    g += `<polyline fill="none" stroke="${LCOL[s.slot % 6]}" stroke-width="${win ? 5 : 3}" stroke-opacity="${win ? 1 : .55}" stroke-linecap="round" stroke-linejoin="round" points="${pts.map((p) => p.join(',')).join(' ')}"/>`;
    g += `<text x="${x(s.slot)}" y="${top - 14}" text-anchor="middle" font-size="11" fill="${LCOL[s.slot % 6]}">${esc(s.name.length > 4 ? s.name.slice(0, 4) + '…' : s.name)}</text>`;
  });
  for (let i = 0; i < N; i++) g += `<text x="${x(i)}" y="${bot + 22}" text-anchor="middle" font-size="${i === r.win_end ? 18 : 12}" fill="${i === r.win_end ? '#ffb800' : '#8d8aa8'}">${i === r.win_end ? '🏆' : '꽝'}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W + 40}px;display:block;margin:6px auto">${g}</svg>`;
}

}

/* ---- 🧱 블록 블라스트 (혼자 하는 퍼즐: 끝나면 점수에 비례해 🪙을 받음) ---- */

    ['X..', 'X..', 'XXX'], ['..X', '..X', 'XXX'], ['XXX', 'X..', 'X..'], ['XXX', '..X', '..X'],

  const WEIGHT = SHAPES.map((s) => (s.cells.length <= 2 ? 3 : s.cells.length <= 4 ? 4 : 2));   // 작은 블록이 더 자주
  const root = document.createElement('div'); root.className = 'bbx';
  root.innerHTML = `<div class="bbtop"><div class="bbbox"><small>점수</small><b class="bbscore">0</b></div><div class="bbbox"><small>예상 보상</small><b class="bbrew">0</b></div><div class="bbbox gold"><small>내 최고</small><b class="bbbest">0</b></div></div>
    <div class="bbwrap"><div class="bbboard"></div><div class="bbover"><div class="bbcard"></div></div></div><div class="bbtray"></div>
    <p class="mute" style="text-align:center;margin:8px 0 0">블록을 끌어서 판에 놓으십시오. 블록은 돌릴 수 없습니다.</p>`;
  const q = (s) => root.querySelector(s);
  const boardEl = q('.bbboard'), trayEl = q('.bbtray'), overEl = q('.bbover'), cardEl = q('.bbcard');
  const ghostEl = document.createElement('div'); ghostEl.className = 'bbghost'; document.body.appendChild(ghostEl);
  let board, pieces, score = 0, best = 0, combo = 0, running = false, busy = false, drag = null, cells = [], onOver = null, seed = null, setNo = 0;
  try { best = parseInt(LS.get('bb_best') || '0', 10) || 0; } catch { /* 무시 */ }
  const newBoard = () => Array.from({ length: N }, () => Array(N).fill(-1));
  const fits = (b, s, r, c) => s.cells.every(([dy, dx]) => { const y = r + dy, x = c + dx; return y >= 0 && x >= 0 && y < N && x < N && b[y][x] < 0; });
  const fitsAnywhere = (b, s) => { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (fits(b, s, r, c)) return true; return false; };
  const pick = () => { const total = WEIGHT.reduce((a, b) => a + b, 0); let t = Math.random() * total; for (let i = 0; i < SHAPES.length; i++) { t -= WEIGHT[i]; if (t <= 0) return i; } return 0; };
  const mulberry = (a) => () => { a = (a + 0x6D2B79F5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  function pickWith(rnd) { const total = WEIGHT.reduce((a, b) => a + b, 0); let t = rnd() * total; for (let i = 0; i < SHAPES.length; i++) { t -= WEIGHT[i]; if (t <= 0) return i; } return 0; }
  function newPieces() {

      const rnd = mulberry((seed + Math.imul(++setNo, 7919)) >>> 0);

    }

      set = [0, 1, 2].map(() => ({ shape: SHAPES[pick()], color: Math.floor(Math.random() * COLORS), used: false }));
      if (set.some((p) => fitsAnywhere(board, p.shape))) return set;   // 하나도 못 놓는 조합으로 시작하지 않음

  }
  function fullLines(b, s, r, c, color) {

  }
  const points = (placed, lines, comboNow) => Math.round((placed + (lines > 0 ? 10 * lines * lines : 0)) * (comboNow >= 2 ? 1 + 0.5 * (comboNow - 1) : 1));

  function buildBoard() { boardEl.innerHTML = ''; cells = []; for (let i = 0; i < N * N; i++) { const d = document.createElement('div'); d.className = 'bbc'; boardEl.appendChild(d); cells.push(d); } }
  function paintBoard() { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const el = cells[y * N + x], v = board[y][x]; el.className = 'bbc' + (v >= 0 ? ' f' : ''); el.style.setProperty('--k', v >= 0 ? `var(--b${v})` : 'transparent'); } }

  }
  const cellPx = () => (cells[0] && cells[0].getBoundingClientRect().width) || 36;
  function paintTray() {

    (pieces || [{ shape: SHAPES[0], used: true }, { shape: SHAPES[0], used: true }, { shape: SHAPES[0], used: true }]).forEach((p, i) => {
      const slot = document.createElement('div'); slot.className = 'bbslot' + (p.used ? ' empty' : '');
      if (!p.used) { const el = pieceEl(p, size, 2); if (!fitsAnywhere(board, p.shape)) el.classList.add('dim'); slot.appendChild(el); slot.addEventListener('pointerdown', (e) => startDrag(e, i)); }
      trayEl.appendChild(slot);
    });
  }
  function setScore() { q('.bbscore').textContent = score.toLocaleString(); q('.bbrew').textContent = (bbCur && bbCur.kind === 'war') ? '대결' : rewardOf(score).toLocaleString() + '🪙'; q('.bbbest').textContent = best.toLocaleString(); }
  function floatText(txt, big) { const f = document.createElement('div'); f.className = 'bbfloat' + (big ? ' big' : ''); f.textContent = txt; q('.bbwrap').appendChild(f); setTimeout(() => f.remove(), 950); }

  function startDrag(e, i) {

  const clearPreview = () => cells.forEach((el) => el.classList.remove('ok', 'bad', 'line'));

    const br = boardEl.getBoundingClientRect(), cs = cellPx() + 3;
    const c = Math.round((cx - drag.w / 2 - br.left - 8) / cs), r = Math.round((cy - drag.h / 2 - br.top - 8) / cs);

  function showCard(html) { cardEl.innerHTML = html; overEl.classList.add('on'); }

  function reset() { board = newBoard(); pieces = null; score = 0; combo = 0; running = false; busy = false; setScore(); paintBoard(); paintTray(); }

(function () {
  const walk = (root) => {
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), hits = [];
    for (let n = w.nextNode(); n; n = w.nextNode()) if (n.nodeValue.includes('🪙') && !/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)) hits.push(n);
    for (const n of hits) {
      const parts = n.nodeValue.split('🪙'), f = document.createDocumentFragment();
      parts.forEach((t, i) => { if (i) { const c = document.createElement('i'); c.className = 'chip'; f.append(c); } if (t) f.append(t); });
      n.replaceWith(f);
    }
  };
  new MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) { if (n.nodeType === 1) walk(n); else if (n.nodeType === 3 && n.parentNode && n.nodeValue.includes('🪙')) walk(n.parentNode); } })
    .observe(document.documentElement, { childList: true, subtree: true });
})();

const askName = async (id) => { const v = await askText('새 닉네임?'); if (v) userAct(id, 'rename', v); };
const askPin = async (id) => { const v = await askText('새 PIN (공백 없이 4~16자). 방은 그대로입니다.'); if (v) userAct(id, 'reset_pin', v); };
const askRoom = async (id) => { const v = await askText('옮길 방 코드 (글자/숫자 4~12자). 없는 코드면 방이 새로 만들어집니다.'); if (v) userAct(id, 'move_room', v); };
const betAct = guard(async (bet_id, action, option_id) => {
  const msg = { delete: '도박을 삭제합니까? (진행 중이면 환불)', cancel: '취소하고 전액 환불합니까?', resolve: '이 선택지를 정답으로 확정합니까?' }[action];
  if (msg && !await ask(msg)) return;
  await api('POST', '/api/admin/bet', { bet_id, action, option_id }); toast('완료'); await load();
});
const delMsg = guard(async (id) => { await api('POST', '/api/admin/chat', { id }); await load(); });
const saveSettings = guard(async () => {
  const values = {};
  for (const sp of data.settings) {
    const el = document.getElementById('st_' + sp.key);
    if (sp.type === 'bool') values[sp.key] = el.checked;
    else { const n = Number(el.value); if (el.value.trim() === '' || !Number.isInteger(n)) throw new Error(`${sp.label}: 정수를 넣어주십시오.`); values[sp.key] = n; }
  }
  await api('POST', '/api/admin/settings', { values }); toast('⚙️ 저장했습니다. 바로 적용됩니다'); await load();
});
const resetSetting = guard(async (key) => { await api('POST', '/api/admin/settings', { reset: [key] }); toast('기본값으로 되돌렸습니다'); await load(); });
const resetAllSettings = guard(async () => {
  if (!await ask('모든 설정을 기본값으로 되돌리시겠습니까?')) return;
  await api('POST', '/api/admin/settings', { reset: data.settings.map((x) => x.key) }); toast('모두 기본값으로 되돌렸습니다'); await load();
});
const closeRoom = guard(async (kind, id) => {
  if (!await ask('이 방을 닫습니까? 참가자 모두에게 판돈이 환불됩니다.')) return;
  await api('POST', '/api/admin/room', { kind, room_id: id }); toast('방을 닫고 환불했습니다'); await load();
});
const delGroup = guard(async (i) => {
  const g = data.groups[i];
  const t = await askText(`⚠️ 방 "${g.label}"(${g.members.join(', ') || '비어 있음'})을 통째로 지웁니다.\n그 방의 계정·칩·도박·채팅·게임 기록이 전부 사라지고 되돌릴 수 없습니다.\n\n정말 지우려면 "삭제"라고 입력하십시오.`);
  if (t !== '삭제') return;
  const r = await api('POST', '/api/admin/group', { grp: g.id }); toast(`방을 지웠습니다 (계정 ${r.deleted_users}개)`); await load();
});
const gift = guard(async () => {
  const v = Number($('#gift').value);
  if (!await ask(`모든 유저에게 ${v}🪙을 지급하시겠습니까?`)) return;
  await api('POST', '/api/admin/gift', { amount: v }); toast('🎁 지급 완료'); await load();
});

function render() {
  const st = data.stats;
  const S = { open: '진행', closed: '마감', resolved: '확정', cancelled: '취소' };
  $('#app').innerHTML = `<div class="row"><h1 style="margin:0">🛠 관리자 콘솔</h1><button onclick="closeAdmin()">← 도박장</button></div>
  <div class="stats">
    <div class="stat">유저<b>${st.users}</b></div><div class="stat">유통 🪙<b>${st.points.toLocaleString()}</b></div>
    <div class="stat">총 베팅 수<b>${st.wagers}</b></div><div class="stat">총 베팅액<b>${st.wagered.toLocaleString()}🪙</b></div>
    <div class="stat">🍀 럭키 당첨<b>${st.lucky}</b></div></div>
  <div class="card"><h2>⚙️ 설정 <span class="mute">(저장하면 바로 적용됩니다)</span></h2>
    ${data.settings.map((sp) => `<div class="set"><div><b>${esc(sp.label)}</b><div class="mute">${esc(sp.hint || '')} · 기본값 ${sp.type === 'bool' ? (sp.default ? '켜짐' : '꺼짐') : sp.default}</div></div>
      <div class="acts">${sp.type === 'bool' ? `<label class="sw"><input id="st_${sp.key}" type="checkbox" ${sp.value ? 'checked' : ''}> ${'켜기'}</label>` : `<input id="st_${sp.key}" type="number" min="${sp.min}" max="${sp.max}" value="${sp.value}">`}
      ${sp.value !== sp.default ? `<button onclick="ADM.resetSetting('${sp.key}')" title="기본값으로">↺</button>` : ''}</div></div>`).join('')}
    <div class="acts" style="margin-top:10px"><button class="pri" onclick="ADM.saveSettings()">저장</button><button onclick="ADM.resetAllSettings()">전부 기본값으로</button></div></div>
  <div class="card"><h2>🚪 방 <span class="mute">(방 코드가 같은 사람들끼리)</span></h2>${data.groups.map((g, i) => `<div class="item2"><div><span class="tag">방 ${esc(g.label)}</span> <b>${g.count}명</b> <span class="mute">· 칩 합 ${g.points.toLocaleString()} · 도박 ${g.bets}개 · 열린 게임 방 ${g.rooms}개</span>
      <div class="mute">${g.members.map(esc).join(', ')}</div></div><button class="danger" onclick="ADM.delGroup(${i})">방 삭제</button></div>`).join('') || '<p class="mute">없음</p>'}</div>
  <div class="card"><h2>🎮 열려 있는 게임 방 <span class="mute">(참가자를 기다리는 중 · 낸 패/숫자는 보이지 않습니다)</span></h2>${data.rooms.map((r) => `<div class="item2"><div><span class="tag">${{ rps: '✊ 가위바위보', lun: '🤫 최저 유일 숫자', lad: '🪜 사다리' }[r.kind]}</span> <b>${esc(r.host)}</b> <span class="mute">· 판돈 ${r.stake}🪙 · ${r.players.length}/${r.cap}명 · 방 ${esc(r.grp || '없음')} · ${new Date(r.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
      <div class="mute">${r.players.map(esc).join(', ')}</div></div><button class="danger" onclick="ADM.closeRoom('${r.kind}',${r.id})">닫기(환불)</button></div>`).join('') || '<p class="mute">열려 있는 게임 방이 없습니다.</p>'}</div>
  <div class="card"><h2>🎁 전체 지급</h2><input id="gift" type="number" placeholder="지급할 칩"> <button class="pri" onclick="ADM.gift()">모두에게 주기</button></div>
  <div class="card"><h2>유저</h2><table>${data.users.map((u) => `<tr><td><b>${esc(u.name)}</b> ${u.approved === 0 ? '<span class="tag" style="color:var(--dog)">승인 대기</span> <button class="pri" onclick="ADM.userAct(' + u.id + ',\'approve\')">승인</button>' : ''} ${u.grp ? `<span class="tag" title="방 코드">방 ${esc(u.grp)}</span>` : '<span class="tag">방 없음</span>'}</td><td>${u.points.toLocaleString()}🪙</td><td><div class="acts">
    <button onclick="ADM.askPoints(${u.id},'add_points')">± 더하기</button><button onclick="ADM.askPoints(${u.id},'set_points')">= 설정</button>
    <button onclick="ADM.askName(${u.id})">닉네임</button><button onclick="ADM.userAct(${u.id},'clear_device')" title="이 계정에 묶인 기기를 풀어, 그 기기에서 새 계정을 만들 수 있게 합니다">기기 해제</button><button onclick="ADM.askPin(${u.id})">PIN 초기화</button><button onclick="ADM.askRoom(${u.id})">방 변경</button><button class="danger" onclick="ADM.userAct(${u.id},'delete')">삭제</button></div></td></tr>`).join('')}</table></div>
  <div class="card"><h2>💬 최근 채팅</h2>${data.messages.map((m) => `<div class="mute"><b style="color:var(--cyan)">${esc(m.name)}</b>${m.bet_title ? ` <span class="tag">${esc(m.bet_title)}</span>` : ''}: ${esc(m.text)} <button class="danger" style="padding:0 6px" onclick="ADM.delMsg(${m.id})">삭제</button></div>`).join('') || '<p class="mute">없음</p>'}</div>
  <div class="card"><h2>도박</h2>${data.bets.map((b) => `<div style="border-bottom:1px solid var(--line);padding:8px 0">
    <b>${esc(b.title)}</b> <span class="tag">${S[b.status]}</span> <span class="mute">by ${esc(b.creator)} · 총 ${b.total}🪙</span>
    <div class="opts mute">${b.options.map((o) => `${b.winner === o.id ? '🏆' : ''}${esc(o.label)} (${o.pool}🪙/${o.bettors}명) ${b.status === 'open' || b.status === 'closed' ? `<button onclick="ADM.betAct(${b.id},'resolve',${o.id})">정답</button>` : ''}`).join(' · ')}</div>
    <div class="acts" style="margin-top:4px">${b.status === 'open' ? `<button onclick="ADM.betAct(${b.id},'close')">마감</button>` : ''}${b.status === 'open' || b.status === 'closed' ? `<button onclick="ADM.betAct(${b.id},'cancel')">취소(환불)</button>` : ''}<button class="danger" onclick="ADM.betAct(${b.id},'delete')">삭제</button></div></div>`).join('') || '<p class="mute">도박이 없습니다.</p>'}</div>`;
}



return { resetSetting, saveSettings, resetAllSettings, delGroup, closeRoom, gift, userAct, askPoints, askName, askPin, askRoom, delMsg, betAct, open() { load(); timer = setInterval(() => { if (document.activeElement?.tagName !== 'INPUT' && !document.hidden) load(); }, 5000); }, close() { clearInterval(timer); } };
})();
</script>
